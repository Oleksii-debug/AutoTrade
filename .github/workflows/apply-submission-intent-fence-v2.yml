name: apply-submission-intent-fence-v2

on:
  push:
    branches:
      - fix/submission-intent-send-fence-20261005-sol56

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[intent-fence-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/submission-intent-send-fence-20261005-sol56
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact scoped patch
        run: python .github/scripts/submission_intent_fence_patch.py

      - name: Prove exact source scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | cut -c4- | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "mvp/autotrade_mvp/dispatch.py"
          test "${changed[1]}" = "mvp/tests/test_dispatch_intent_fence.py"

      - name: Compile and run dispatch authority tests
        run: |
          python -m py_compile mvp/autotrade_mvp/dispatch.py mvp/tests/test_dispatch_intent_fence.py
          python -m pytest mvp/tests/test_dispatch.py mvp/tests/test_dispatch_intent_fence.py -q

      - name: Commit only verified product source and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mvp/autotrade_mvp/dispatch.py mvp/tests/test_dispatch_intent_fence.py
          git diff --cached --name-only | diff -u <(printf '%s\n' mvp/autotrade_mvp/dispatch.py mvp/tests/test_dispatch_intent_fence.py) -
          git commit -m 'Fix: fence provider send by durable economic intent [intent-fence-applied]'
          git push origin HEAD:fix/submission-intent-send-fence-20261005-sol56
