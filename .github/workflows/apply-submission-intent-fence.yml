name: apply-submission-intent-fence

on:
  push:
    branches:
      - fix/submission-intent-send-fence-20261005-sol56

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[intent-fence-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/submission-intent-send-fence-20261005-sol56
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply scoped financial-send authority fix
        run: python .github/scripts/submission_intent_fence_patch.py

      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | cut -c4- | sort)
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 2 ]]
          [[ " ${changed[*]} " == *" mvp/autotrade_mvp/dispatch.py "* ]]
          [[ " ${changed[*]} " == *" mvp/tests/test_dispatch_intent_fence.py "* ]]

      - name: Compile touched Python
        run: |
          python -m py_compile mvp/autotrade_mvp/dispatch.py
          python -m py_compile mvp/tests/test_dispatch_intent_fence.py

      - name: Run dispatch authority regression suite
        run: python -m pytest mvp/tests/test_dispatch.py mvp/tests/test_dispatch_intent_fence.py -q

      - name: Commit verified source fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mvp/autotrade_mvp/dispatch.py mvp/tests/test_dispatch_intent_fence.py
          git commit -m 'Fix: fence provider send by durable economic intent [intent-fence-applied]'
          git push origin HEAD:fix/submission-intent-send-fence-20261005-sol56
