name: baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/baseline.py check
      - name: Write exact-head baseline evidence
        run: python tools/write_ci_evidence.py --suite baseline --command "python tools/baseline.py check" --output "artifacts/baseline-${{ runner.os }}.json"
      - name: Upload exact-head baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: baseline-evidence-${{ runner.os }}
          path: artifacts/baseline-${{ runner.os }}.json
          if-no-files-found: error
