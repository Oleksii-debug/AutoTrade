name: contracts

on:
  workflow_dispatch:
  push:
    paths:
      - "contracts/**"
      - "tests/Contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "tests/Contracts/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  json-schema:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/Contracts -v
