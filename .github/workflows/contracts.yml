name: contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "tests/Contracts/**"
      - "tests/Contracts.DotNet/**"
      - "tests/Contracts.TypeScript/**"
      - "src/AutoTrade.Contracts/**"
      - "tools/contract_version_guard.py"
      - "tools/generate_common_scalar_corpus.py"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "tests/Contracts/**"
      - "tests/Contracts.DotNet/**"
      - "tests/Contracts.TypeScript/**"
      - "src/AutoTrade.Contracts/**"
      - "tools/contract_version_guard.py"
      - "tools/generate_common_scalar_corpus.py"
      - ".github/workflows/contracts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  json-schema:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/generate_common_scalar_corpus.py --check
      - run: python -m unittest discover -s tests/Contracts -v
      - run: dotnet run --project tests/Contracts.DotNet/Contracts.DotNet.csproj --configuration Release -- contracts/fixtures/common-scalars.corpus.json
      - run: node tests/Contracts.TypeScript/common-scalars.test.cjs
      - if: github.event_name == 'pull_request'
        run: python tools/contract_version_guard.py --base-ref origin/${{ github.base_ref }}
