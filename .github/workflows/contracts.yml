name: contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "tests/Contracts/**"
      - "tests/Contracts.DotNet/**"
      - "tests/Contracts.TypeScript/**"
      - "src/AutoTrade.Contracts/**"
      - "tools/contract_version_guard.py"
      - "tools/generate_common_scalar_corpus.py"
      - "tools/generate_common_scalar_bindings.py"
      - "tools/generate_host_api_routes.py"
      - "web/src/host-api-routes.js"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "tests/Contracts/**"
      - "tests/Contracts.DotNet/**"
      - "tests/Contracts.TypeScript/**"
      - "src/AutoTrade.Contracts/**"
      - "tools/contract_version_guard.py"
      - "tools/generate_common_scalar_corpus.py"
      - "tools/generate_common_scalar_bindings.py"
      - "tools/generate_host_api_routes.py"
      - "web/src/host-api-routes.js"
      - ".github/workflows/contracts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  json-schema:
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12.10"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.100"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/generate_common_scalar_bindings.py --check
      - run: python tools/generate_host_api_routes.py --check
      - run: python tools/generate_common_scalar_corpus.py --check
      - run: python -m unittest discover -s tests/Contracts -v
      - run: dotnet run --project tests/Contracts.DotNet/Contracts.DotNet.csproj --configuration Release -- contracts/fixtures/common-scalars.corpus.json
      - run: node tests/Contracts.TypeScript/common-scalars.test.cjs
      - run: node tests/Contracts.TypeScript/host-api-routes.test.cjs
      - if: github.event_name == 'pull_request'
        run: python tools/contract_version_guard.py --base-ref origin/${{ github.base_ref }}
      - name: Write exact-head contracts evidence for pull request
        if: github.event_name == 'pull_request'
        run: python tools/write_ci_evidence.py --suite contracts --command "json-schema + dotnet + typescript + contract-version-guard" --output "artifacts/contracts-${{ runner.os }}.json"
      - name: Write exact-head contracts evidence for non-PR run
        if: github.event_name != 'pull_request'
        run: python tools/write_ci_evidence.py --suite contracts --command "json-schema + dotnet + typescript" --output "artifacts/contracts-${{ runner.os }}.json"
      - name: Upload exact-head contracts evidence
        uses: actions/upload-artifact@v4
        with:
          name: contracts-evidence-${{ runner.os }}
          path: artifacts/contracts-${{ runner.os }}.json
          if-no-files-found: error
