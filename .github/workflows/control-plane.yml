name: control-plane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "control/tools/**"
      - "tests/Control/**"
      - "provenance/first-party-reuse-autosport-swarm-control-2026-09-22.md"
      - ".github/workflows/control-plane.yml"
  pull_request:
    paths:
      - "control/tools/**"
      - "tests/Control/**"
      - ".github/workflows/control-plane.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

jobs:
  registry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12.10"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - run: python -m unittest discover -s tests/Control -v
      - name: Write exact-head control-plane evidence
        run: >-
          python tools/write_ci_evidence.py
          --suite control-plane
          --command "python -m unittest discover -s tests/Control -v"
          --output "artifacts/control-plane-${{ runner.os }}.json"
      - name: Upload exact-head control-plane evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-plane-evidence-${{ runner.os }}
          path: artifacts/control-plane-${{ runner.os }}.json
          if-no-files-found: error
