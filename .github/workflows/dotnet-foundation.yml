name: dotnet-foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "global.json"
      - "Directory.Build.props"
      - ".editorconfig"
      - "src/**/*.cs"
      - "src/**/*.csproj"
      - "src/**/packages.lock.json"
      - "tests/**/packages.lock.json"
      - "src/**/*.xaml"
      - "tests/Desktop.Client/**"
      - "contracts/**"
      - ".github/workflows/dotnet-foundation.yml"
  pull_request:
    paths:
      - "global.json"
      - "Directory.Build.props"
      - ".editorconfig"
      - "src/**/*.cs"
      - "src/**/*.csproj"
      - "src/**/packages.lock.json"
      - "tests/**/packages.lock.json"
      - "src/**/*.xaml"
      - "tests/Desktop.Client/**"
      - "contracts/**"
      - ".github/workflows/dotnet-foundation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.100"
      - run: dotnet --info
      # WP-03 requires committed lock files and fail-closed locked restore for every canonical restore command.
      - run: dotnet restore src/AutoTrade.Contracts/AutoTrade.Contracts.csproj --use-lock-file --locked-mode
      - name: Emit generated Contracts NuGet lock
        shell: pwsh
        run: Get-Content -Raw src/AutoTrade.Contracts/packages.lock.json
      - run: dotnet build src/AutoTrade.Contracts/AutoTrade.Contracts.csproj --configuration Release --no-restore

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.100"
      - run: dotnet restore src/AutoTrade.Desktop/AutoTrade.Desktop.csproj --use-lock-file --locked-mode
      - name: Emit generated Desktop NuGet lock
        shell: pwsh
        run: Get-Content -Raw src/AutoTrade.Desktop/packages.lock.json
      - run: dotnet build src/AutoTrade.Desktop/AutoTrade.Desktop.csproj --configuration Release --no-restore
      - run: dotnet restore tests/Desktop.Client/Desktop.Client.csproj --use-lock-file --locked-mode
      - name: Emit generated Desktop.Client NuGet lock
        shell: pwsh
        run: Get-Content -Raw tests/Desktop.Client/packages.lock.json
      - run: dotnet run --project tests/Desktop.Client/Desktop.Client.csproj --configuration Release --no-restore
