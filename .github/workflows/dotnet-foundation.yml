name: dotnet-foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "Directory.Packages.targets"
      - "src/**/*.props"
      - "src/**/*.targets"
      - ".editorconfig"
      - "src/**/*.cs"
      - "src/**/*.csproj"
      - "src/**/packages.lock.json"
      - "src/**/*.xaml"
      - "tests/Desktop.Client/**"
      - "tests/Provenance/test_dotnet_package_rights.py"
      - "tests/Provenance/test_dotnet_lock_content.py"
      - "contracts/**"
      - "provenance/dotnet-package-rights.json"
      - "provenance/licenses/**"
      - "tools/dotnet_package_rights.py"
      - "tools/dotnet_lock.py"
      - ".github/workflows/dotnet-foundation.yml"
  pull_request:
    paths:
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "Directory.Packages.targets"
      - "src/**/*.props"
      - "src/**/*.targets"
      - ".editorconfig"
      - "src/**/*.cs"
      - "src/**/*.csproj"
      - "src/**/packages.lock.json"
      - "src/**/*.xaml"
      - "tests/Desktop.Client/**"
      - "tests/Provenance/test_dotnet_package_rights.py"
      - "tests/Provenance/test_dotnet_lock_content.py"
      - "contracts/**"
      - "provenance/dotnet-package-rights.json"
      - "provenance/licenses/**"
      - "tools/dotnet_package_rights.py"
      - "tools/dotnet_lock.py"
      - ".github/workflows/dotnet-foundation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.100"
      - run: dotnet --info
      - run: python tools/dotnet_package_rights.py --check-policy
      - run: python -m unittest discover -s tests/Provenance -p "test_dotnet_package_rights.py"
      - run: dotnet restore src/AutoTrade.Contracts/AutoTrade.Contracts.csproj --locked-mode
      - run: python tools/dotnet_package_rights.py --verify-restored --packages-root "${{ env.NUGET_PACKAGES }}" --project src/AutoTrade.Contracts/AutoTrade.Contracts.csproj
      - run: dotnet build src/AutoTrade.Contracts/AutoTrade.Contracts.csproj --configuration Release --no-restore
      - name: Write exact-head .NET foundation evidence
        run: >-
          python tools/write_ci_evidence.py
          --suite dotnet-foundation
          --command "locked AutoTrade.Contracts restore/build"
          --output "artifacts/dotnet-foundation-${{ runner.os }}.json"
      - name: Upload exact-head .NET foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-foundation-evidence-${{ runner.os }}
          path: artifacts/dotnet-foundation-${{ runner.os }}.json
          if-no-files-found: error

  desktop-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.100"
      - run: python tools/dotnet_package_rights.py --check-policy
      - run: dotnet restore src/AutoTrade.Desktop/AutoTrade.Desktop.csproj -r win-x64 --locked-mode
      - run: python tools/dotnet_package_rights.py --verify-restored --packages-root "${{ env.NUGET_PACKAGES }}" --project src/AutoTrade.Desktop/AutoTrade.Desktop.csproj
      - run: dotnet build src/AutoTrade.Desktop/AutoTrade.Desktop.csproj --configuration Release -r win-x64 --no-restore
      - run: dotnet restore tests/Desktop.Client/Desktop.Client.csproj --locked-mode
      - run: dotnet run --project tests/Desktop.Client/Desktop.Client.csproj --configuration Release --no-restore
      - name: Write exact-head desktop foundation evidence
        run: >-
          python tools/write_ci_evidence.py
          --suite dotnet-desktop-foundation
          --command "locked WebView2 restore + package rights readback + AutoTrade.Desktop build + Desktop.Client"
          --output "artifacts/dotnet-desktop-Windows.json"
      - name: Upload exact-head desktop foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-desktop-foundation-evidence-Windows
          path: artifacts/dotnet-desktop-Windows.json
          if-no-files-found: error
