name: dotnet-foundation

on:
  push:
    paths:
      - "global.json"
      - "Directory.Build.props"
      - ".editorconfig"
      - "src/**/*.cs"
      - "src/**/*.csproj"
      - "contracts/**"
      - ".github/workflows/dotnet-foundation.yml"
  pull_request:
    paths:
      - "global.json"
      - "Directory.Build.props"
      - ".editorconfig"
      - "src/**/*.cs"
      - "src/**/*.csproj"
      - "contracts/**"
      - ".github/workflows/dotnet-foundation.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet --info
      - run: dotnet restore src/AutoTrade.Contracts/AutoTrade.Contracts.csproj --locked-mode
        continue-on-error: true
      - run: dotnet restore src/AutoTrade.Contracts/AutoTrade.Contracts.csproj
      - run: dotnet build src/AutoTrade.Contracts/AutoTrade.Contracts.csproj --configuration Release --no-restore
