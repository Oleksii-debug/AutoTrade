name: futures-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mvp/autotrade_mvp/futures.py"
      - "mvp/autotrade_mvp/futures_journal.py"
      - "mvp/tests/test_futures.py"
      - "mvp/tests/test_futures_journal.py"
      - ".github/workflows/futures-qualification.yml"
  push:
    branches: [main]
    paths:
      - "mvp/autotrade_mvp/futures.py"
      - "mvp/autotrade_mvp/futures_journal.py"
      - "mvp/tests/test_futures.py"
      - "mvp/tests/test_futures_journal.py"
      - ".github/workflows/futures-qualification.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12.10"]
    runs-on: ${{ matrix.os }}
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Run futures settlement and durable journal qualification
        run: python -m unittest mvp.tests.test_futures mvp.tests.test_futures_journal -v
      - name: Write exact-head futures qualification evidence
        run: >-
          python tools/write_ci_evidence.py
          --suite futures-qualification
          --command "python -m unittest mvp.tests.test_futures mvp.tests.test_futures_journal -v"
          --output "artifacts/futures-qualification-${{ runner.os }}.json"
      - name: Upload exact-head futures qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: futures-qualification-evidence-${{ runner.os }}
          path: artifacts/futures-qualification-${{ runner.os }}.json
          if-no-files-found: error
