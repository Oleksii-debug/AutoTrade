name: futures-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mvp/autotrade_mvp/futures.py"
      - "mvp/autotrade_mvp/futures_journal.py"
      - "mvp/tests/test_futures.py"
      - "mvp/tests/test_futures_journal.py"
      - ".github/workflows/futures-qualification.yml"
  push:
    branches: [main]
    paths:
      - "mvp/autotrade_mvp/futures.py"
      - "mvp/autotrade_mvp/futures_journal.py"
      - "mvp/tests/test_futures.py"
      - "mvp/tests/test_futures_journal.py"
      - ".github/workflows/futures-qualification.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run futures settlement and durable journal qualification
        run: python -m unittest mvp.tests.test_futures mvp.tests.test_futures_journal -v
