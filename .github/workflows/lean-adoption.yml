name: lean-adoption

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/AutoTrade.Engine.Lean/**"
      - "tests/Integration/LeanAdoption/**"
      - "provenance/components.json"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/lean-adoption.yml"
  pull_request:
    paths:
      - "src/AutoTrade.Engine.Lean/**"
      - "tests/Integration/LeanAdoption/**"
      - "provenance/components.json"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/lean-adoption.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  LEAN_REVISION: 985ef30ad3ac774218c5ac516b4cb0aa2655730f
  LEAN_TREE: 4b163abf9fca60e731b76510b9ae6721ffff7e6c
  LEAN_LICENSE_BLOB: 6faed93d21a1a9551b11434e87c9000a393d73f2

jobs:
  exact-revision-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout exact AutoTrade source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
          path: autotrade

      - name: Checkout approved LEAN revision
        uses: actions/checkout@v7
        with:
          repository: QuantConnect/Lean
          ref: ${{ env.LEAN_REVISION }}
          path: lean
          fetch-depth: 1

      - name: Verify exact LEAN source identity
        shell: pwsh
        run: |
          $actualCommit = (git -C lean rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:LEAN_REVISION) {
            throw "LEAN checkout mismatch: expected $env:LEAN_REVISION, got $actualCommit"
          }
          $actualTree = (git -C lean rev-parse "HEAD^{tree}").Trim()
          if ($actualTree -ne $env:LEAN_TREE) {
            throw "LEAN tree mismatch: expected $env:LEAN_TREE, got $actualTree"
          }
          $actualLicense = (git -C lean hash-object LICENSE).Trim()
          if ($actualLicense -ne $env:LEAN_LICENSE_BLOB) {
            throw "LEAN license blob mismatch: expected $env:LEAN_LICENSE_BLOB, got $actualLicense"
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build and run non-sending adoption probe
        shell: pwsh
        working-directory: autotrade
        env:
          LEAN_ROOT: ${{ github.workspace }}/lean
        run: |
          dotnet run `
            --project tests/Integration/LeanAdoption/LeanAdoptionProbe.csproj `
            --configuration Release `
            "-p:LeanRoot=$env:LEAN_ROOT"


      - name: Write exact-head adoption evidence
        shell: pwsh
        working-directory: autotrade
        env:
          LEAN_ROOT: ${{ github.workspace }}/lean
        run: |
          $evidenceDir = "artifacts/lean-adoption"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $assetRows = Get-ChildItem -Path $env:LEAN_ROOT -Filter project.assets.json -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($env:LEAN_ROOT, $_.FullName)
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $relative"
            }
          $assetManifest = Join-Path $evidenceDir "lean-project-assets-sha256.txt"
          $assetRows | Set-Content -Encoding utf8 $assetManifest
          $assetManifestHash = (Get-FileHash -Algorithm SHA256 $assetManifest).Hash.ToLowerInvariant()
          $actualSource = (git rev-parse HEAD).Trim()
          if ($actualSource -ne $env:AUTOTRADE_SOURCE_SHA) {
            throw "AutoTrade checkout mismatch: expected $env:AUTOTRADE_SOURCE_SHA, got $actualSource"
          }
          $evidence = [ordered]@{
            schema_version = "1.0.0"
            source_sha = $actualSource
            lean_revision = $env:LEAN_REVISION
            lean_tree = $env:LEAN_TREE
            lean_license_blob = $env:LEAN_LICENSE_BLOB
            runner_os = $env:RUNNER_OS
            dotnet_version = (dotnet --version).Trim()
            probe_result = "PASS"
            dependency_asset_manifest_sha256 = "sha256:$assetManifestHash"
          }
          $evidence |
            ConvertTo-Json -Depth 4 |
            Set-Content -Encoding utf8 (Join-Path $evidenceDir "evidence.json")

      - name: Upload exact-head adoption evidence
        uses: actions/upload-artifact@v4
        with:
          name: lean-adoption-evidence-${{ runner.os }}
          path: autotrade/artifacts/lean-adoption/*
          if-no-files-found: error
