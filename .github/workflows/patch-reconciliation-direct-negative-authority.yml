name: Patch reconciliation direct negative authority

on:
  push:
    branches:
      - fix/reconciliation-direct-negative-authority-20261005-sol56

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply exact direct-loader guard patch
        run: python tools/_patch_reconciliation_direct_negative_authority.py
      - name: Compile changed module
        run: python -m py_compile mvp/autotrade_mvp/reconciliation_journal.py
      - name: Run focused negative-authority verification
        run: >-
          python -m unittest
          mvp.tests.test_reconciliation_direct_negative_authority
          mvp.tests.test_reconciliation_negative_resolution_authority
      - name: Publish verified implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix: guard direct reconciliation negative authority"
          git push origin HEAD:${GITHUB_REF_NAME}
