name: Patch ZERO scoped outbox

on:
  push:
    branches:
      - test/shared-store-zero-foreign-backlog-20261005-v2-sol56

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply exact scoped-outbox patch
        run: python tools/_patch_zero_scoped_outbox.py
      - name: Compile changed production modules
        run: python -m py_compile mvp/autotrade_mvp/_persistence_impl.py mvp/autotrade_mvp/simulation_runtime_checkpoint.py
      - name: Run focused shared-store and persistence verification
        run: >-
          python -m unittest
          mvp.tests.test_shared_store_zero_foreign_backlog
          mvp.tests.test_shared_store_zero_checkpoint_outbox
          mvp.tests.test_persistence
      - name: Publish verified implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix: scope ZERO outbox scan away from Host UI backlog"
          git push origin HEAD:${GITHUB_REF_NAME}
