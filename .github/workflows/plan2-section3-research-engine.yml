name: plan2-section3-research-engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/autotrade_research/artifacts/**"
      - "research/autotrade_research/evaluation/**"
      - "research/autotrade_research/jobs.py"
      - "research/autotrade_research/science/**"
      - "research/tests/test_protocol_registry.py"
      - "research/tests/test_scientific_trial_owner*.py"
      - "research/tests/test_jobs.py"
      - ".github/workflows/plan2-section3-research-engine.yml"
  push:
    branches: [main]
    paths:
      - "research/autotrade_research/artifacts/**"
      - "research/autotrade_research/evaluation/**"
      - "research/autotrade_research/jobs.py"
      - "research/autotrade_research/science/**"
      - "research/tests/test_protocol_registry.py"
      - "research/tests/test_scientific_trial_owner*.py"
      - "research/tests/test_jobs.py"
      - ".github/workflows/plan2-section3-research-engine.yml"

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: research:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Require the exact clean source candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Qualify protocol to trial to artifact research flow
        shell: bash
        run: >-
          python -m unittest -v
          research.tests.test_protocol_registry
          research.tests.test_scientific_trial_owner
          research.tests.test_scientific_trial_owner_stable_cut
          research.tests.test_scientific_trial_owner_completeness_policy
          research.tests.test_jobs
