name: plan2-section4-ablation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/autotrade_research/evaluation/ablation.py"
      - "research/tests/test_ablation.py"
      - "research/tests/test_ablation_exact_rational.py"
      - ".github/workflows/plan2-section4-ablation.yml"
  push:
    branches: [main]
    paths:
      - "research/autotrade_research/evaluation/ablation.py"
      - "research/tests/test_ablation.py"
      - "research/tests/test_ablation_exact_rational.py"
      - ".github/workflows/plan2-section4-ablation.yml"

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: research:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Require exact clean candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Qualify causal exact-rational ablation
        shell: bash
        run: >-
          python -m unittest -v
          research.tests.test_ablation
          research.tests.test_ablation_exact_rational
