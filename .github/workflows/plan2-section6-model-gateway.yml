name: plan2-section6-model-gateway

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mvp/autotrade_mvp/model_gateway.py"
      - "mvp/autotrade_mvp/model_call.py"
      - "mvp/autotrade_mvp/model_budget_journal.py"
      - "mvp/autotrade_mvp/model_*evidence.py"
      - "mvp/autotrade_mvp/model_production_composition.py"
      - "mvp/tests/test_model*.py"
      - ".github/workflows/plan2-section6-model-gateway.yml"
  push:
    branches: [main]
    paths:
      - "mvp/autotrade_mvp/model_gateway.py"
      - "mvp/autotrade_mvp/model_call.py"
      - "mvp/autotrade_mvp/model_budget_journal.py"
      - "mvp/autotrade_mvp/model_*evidence.py"
      - "mvp/autotrade_mvp/model_production_composition.py"
      - "mvp/tests/test_model*.py"
      - ".github/workflows/plan2-section6-model-gateway.yml"

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - name: Keep Git blob bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --local core.autocrlf false
          git -c core.autocrlf=false reset --hard "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Confirm exact frozen source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Qualify routing, privacy and durable model/billing lifecycle
        shell: bash
        run: |
          python -m unittest -v \
            mvp.tests.test_model_gateway \
            mvp.tests.test_model_budget_journal \
            mvp.tests.test_model_call \
            mvp.tests.test_model_billing_evidence \
            mvp.tests.test_model_pricing_evidence \
            mvp.tests.test_model_observation_evidence \
            mvp.tests.test_model_production_composition
      - name: Qualify negative authority, restart and hostile callback topology
        shell: bash
        run: |
          python -m unittest -v \
            mvp.tests.test_model_budget_trusted_journal_topology_authority \
            mvp.tests.test_model_budget_clock_class_dispatch_authority \
            mvp.tests.test_model_budget_clock_dependency_authority \
            mvp.tests.test_model_budget_clock_function_authority \
            mvp.tests.test_model_budget_clock_journal_module_alias_authority \
            mvp.tests.test_model_budget_clock_module_alias_authority \
            mvp.tests.test_model_budget_clock_nested_global_authority \
            mvp.tests.test_model_call_restore_dispatch_authority \
            mvp.tests.test_model_call_class_rebinding_authority
      - name: Recheck source identity after qualification
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
