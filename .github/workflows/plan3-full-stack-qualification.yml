name: Plan 3 Full Runtime Stack qualification

on:
  pull_request:
    paths:
      - '.github/workflows/plan3-full-stack-qualification.yml'
      - 'mvp/tests/test_plan3_stack_qualification.py'
      - 'mvp/autotrade_mvp/backup.py'
      - 'mvp/autotrade_mvp/recovery*.py'
      - 'mvp/autotrade_mvp/production*.py'
      - 'mvp/autotrade_mvp/host*.py'
      - 'mvp/autotrade_mvp/operator_observability.py'
      - 'mvp/autotrade_mvp/diagnostics.py'
      - 'mvp/autotrade_mvp/simulation_runtime_checkpoint.py'
      - 'mvp/tests/test_backup_restore.py'
      - 'mvp/tests/test_recovery*.py'
      - 'mvp/tests/test_production*.py'
      - 'mvp/tests/test_host*.py'
      - 'mvp/tests/test_operator_observability.py'
      - 'mvp/tests/test_diagnostics.py'
      - 'src/AutoTrade.Host/**'
      - 'tests/Host.Process/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/plan3-full-stack-qualification.yml'
      - 'mvp/tests/test_plan3_stack_qualification.py'
      - 'mvp/autotrade_mvp/backup.py'
      - 'mvp/autotrade_mvp/recovery*.py'
      - 'mvp/autotrade_mvp/production*.py'
      - 'mvp/autotrade_mvp/host*.py'
      - 'mvp/autotrade_mvp/operator_observability.py'
      - 'mvp/autotrade_mvp/diagnostics.py'
      - 'mvp/autotrade_mvp/simulation_runtime_checkpoint.py'
      - 'mvp/tests/test_backup_restore.py'
      - 'mvp/tests/test_recovery*.py'
      - 'mvp/tests/test_production*.py'
      - 'mvp/tests/test_host*.py'
      - 'mvp/tests/test_operator_observability.py'
      - 'mvp/tests/test_diagnostics.py'
      - 'src/AutoTrade.Host/**'
      - 'tests/Host.Process/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan3-qualification:
    name: plan3-full-stack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Compile canonical runtime and exact cross-component campaign
        run: |
          python -m compileall -q mvp/autotrade_mvp/backup.py mvp/autotrade_mvp/production_host.py mvp/autotrade_mvp/recovery.py mvp/autotrade_mvp/host_network.py mvp/autotrade_mvp/diagnostics.py mvp/autotrade_mvp/operator_observability.py mvp/tests/test_plan3_stack_qualification.py
      - name: Crash, recovery, sender fencing, backup, Host and observability fixtures
        run: |
          python -m unittest -v \
            mvp.tests.test_plan3_stack_qualification \
            mvp.tests.test_recovery_takeover \
            mvp.tests.test_recovery_durable_unknown_restart \
            mvp.tests.test_recovery_sender_gate_current \
            mvp.tests.test_runtime_failure_control \
            mvp.tests.test_recovery_clock_incident_chronology \
            mvp.tests.test_dispatch_prepared_recovery_race \
            mvp.tests.test_dispatch_prepared_zero_wire_recovery \
            mvp.tests.test_backup_restore \
            mvp.tests.test_simulation_runtime_checkpoint \
            mvp.tests.test_production_host \
            mvp.tests.test_production_host_config \
            mvp.tests.test_production_host_readiness \
            mvp.tests.test_production_host_runtime_occurrence \
            mvp.tests.test_production_financial_host \
            mvp.tests.test_production_financial_host_authority_bindings \
            mvp.tests.test_host_network \
            mvp.tests.test_host_api \
            mvp.tests.test_durable_host_api \
            mvp.tests.test_operator_observability \
            mvp.tests.test_diagnostics \
            mvp.tests.test_readiness
      - name: Publish non-secret exact-head suite evidence only after completed tests
        env:
          AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/write_ci_evidence.py --suite plan3-full-stack-section8 --command "Plan 3 canonical exact-source integrated recovery, backup, host and observability unittest fixtures" --output plan3-full-stack-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan3-full-stack-${{ runner.os }}-${{ github.sha }}
          path: plan3-full-stack-evidence.json
          if-no-files-found: error

  native-host-qualification:
    name: plan3-native-host-windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'
      - name: Native production Host process and fail-closed startup
        run: dotnet run --project tests/Host.Process/Host.Process.csproj --configuration Release
