name: Plan 3 whole-stack runtime recovery qualification

on:
  pull_request:
    paths:
      - '.github/workflows/plan3-whole-stack-qualification.yml'
      - 'tools/qualify_plan3_stack.py'
      - 'tools/verify_plan3_qualification_receipts.py'
      - 'tests/Control/test_plan3_qualification_receipts.py'
      - 'mvp/autotrade_mvp/backup.py'
      - 'mvp/autotrade_mvp/persistence.py'
      - 'mvp/autotrade_mvp/recovery*.py'
      - 'mvp/autotrade_mvp/production_host*.py'
      - 'mvp/autotrade_mvp/production_financial_host.py'
      - 'mvp/autotrade_mvp/host*.py'
      - 'mvp/autotrade_mvp/operator_observability.py'
      - 'mvp/autotrade_mvp/diagnostics.py'
      - 'mvp/autotrade_mvp/simulation_runtime_checkpoint.py'
      - 'mvp/tests/test_backup_restore.py'
      - 'mvp/tests/test_simulation_runtime_checkpoint.py'
      - 'mvp/tests/test_recovery*.py'
      - 'mvp/tests/test_production_host*.py'
      - 'mvp/tests/test_production_financial_host*.py'
      - 'mvp/tests/test_operator_observability.py'
      - 'mvp/tests/test_diagnostics.py'
      - 'mvp/tests/test_runtime_failure_control.py'
      - 'src/AutoTrade.Host/**'
      - 'tests/Host.Process/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/plan3-whole-stack-qualification.yml'
      - 'tools/qualify_plan3_stack.py'
      - 'tools/verify_plan3_qualification_receipts.py'
      - 'tests/Control/test_plan3_qualification_receipts.py'
      - 'mvp/autotrade_mvp/backup.py'
      - 'mvp/autotrade_mvp/persistence.py'
      - 'mvp/autotrade_mvp/recovery*.py'
      - 'mvp/autotrade_mvp/production_host*.py'
      - 'mvp/autotrade_mvp/production_financial_host.py'
      - 'mvp/autotrade_mvp/host*.py'
      - 'mvp/autotrade_mvp/operator_observability.py'
      - 'mvp/autotrade_mvp/diagnostics.py'
      - 'mvp/autotrade_mvp/simulation_runtime_checkpoint.py'
      - 'mvp/tests/test_backup_restore.py'
      - 'mvp/tests/test_simulation_runtime_checkpoint.py'
      - 'mvp/tests/test_recovery*.py'
      - 'mvp/tests/test_production_host*.py'
      - 'mvp/tests/test_production_financial_host*.py'
      - 'mvp/tests/test_operator_observability.py'
      - 'mvp/tests/test_diagnostics.py'
      - 'mvp/tests/test_runtime_failure_control.py'
      - 'src/AutoTrade.Host/**'
      - 'tests/Host.Process/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-campaign:
    name: full-stack suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Preflight mandatory adversarial tests, no skip
        run: python tools/qualify_plan3_stack.py --check
      - name: Crash, restart, split-brain, backup/restore, Host and redacted observability
        run: python tools/qualify_plan3_stack.py --suite all
      - name: Produce exact-source evidence only after every Python campaign succeeded
        env:
          AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/write_ci_evidence.py --suite plan3-whole-stack-section8 --command "qualify_plan3_stack.py --suite all" --output plan3-stack-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan3-stack-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: plan3-stack-evidence.json
          if-no-files-found: error

  native-host:
    name: native Host.Process (windows-2025)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'
      - name: Exercise existing Windows Host.Process including fail-closed startup
        run: dotnet run --project tests/Host.Process/Host.Process.csproj --configuration Release
      - name: Emit exact-source Host receipt only after native executable tests
        env:
          AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/write_ci_evidence.py --suite plan3-native-host-section8 --command "Host.Process Release executable suite" --output plan3-native-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan3-native-Windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: plan3-native-evidence.json
          if-no-files-found: error

  receipt-verification:
    name: cross-job exact-source evidence and adversarial receipts
    needs: [python-campaign, native-host]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Test receipt checker tamper and missing-evidence negatives
        run: python -m unittest -v tests.Control.test_plan3_qualification_receipts
      - uses: actions/download-artifact@v4
        with:
          pattern: plan3-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: plan3-evidence
          merge-multiple: true
      - name: Reject stale source, wrong runner, duplicated or missing receipts
        run: >-
          python tools/verify_plan3_qualification_receipts.py
          --directory plan3-evidence
          --source ${{ github.event.pull_request.head.sha || github.sha }}
          --run-id ${{ github.run_id }}
          --attempt ${{ github.run_attempt }}
          --event ${{ github.event_name }}

# PASS here is source/fixture Plan-3 evidence only, never provider/PAPER/LIVE,
# real-money, physical NVDA, independent approval or final-release authority.
