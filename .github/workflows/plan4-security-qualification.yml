name: Plan 4 - Security / RBAC component qualification

on:
  pull_request:
    paths:
      - '.github/workflows/plan4-security-qualification.yml'
      - 'mvp/autotrade_mvp/security.py'
      - 'mvp/tests/test_security.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/plan4-security-qualification.yml'
      - 'mvp/autotrade_mvp/security.py'
      - 'mvp/tests/test_security.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compile security and secrets authority
        run: python -m compileall -q mvp/autotrade_mvp/security.py mvp/autotrade_mvp/windows_secrets.py mvp/tests/test_security.py
      - name: Session, RBAC, revocation, adversarial redaction and credential tests
        run: python -m unittest discover -s mvp/tests -p "test_security.py" -v
