name: Plan 4 - Qualification trust primitives

on:
  pull_request:
    paths:
      - '.github/workflows/plan4-trust-primitives.yml'
      - 'mvp/autotrade_mvp/qualification_attestation.py'
      - 'mvp/autotrade_mvp/supply_chain_qualification.py'
      - 'mvp/tests/test_qualification_attestation.py'
      - 'autotrade_runtime/artifacts/**'
      - 'research/autotrade_research/artifacts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/plan4-trust-primitives.yml'
      - 'mvp/autotrade_mvp/qualification_attestation.py'
      - 'mvp/autotrade_mvp/supply_chain_qualification.py'
      - 'mvp/tests/test_qualification_attestation.py'
      - 'autotrade_runtime/artifacts/**'
      - 'research/autotrade_research/artifacts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-trust:
    name: canonical trust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compile existing qualification trust authorities
        run: python -m compileall -q mvp/autotrade_mvp/qualification_attestation.py mvp/autotrade_mvp/supply_chain_qualification.py autotrade_runtime/artifacts mvp/tests/test_qualification_attestation.py
      - name: Exact accepted bytes, root/policy and adversarial trust regressions
        run: python -m unittest mvp.tests.test_qualification_attestation -v
