name: Plan 6 offline provider qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-provider-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install pinned dev dependencies (no broker SDK or credentials)
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Section 1 - provider domain and C/Q contracts (network denied)
        run: python tools/plan6_offline_sections.py --section 1
      - name: Section 1 exact-head non-secret qualification receipt
        run: python tools/write_ci_evidence.py --suite plan6-section1-offline --command "python tools/plan6_offline_sections.py --section 1" --output "artifacts/plan6-section1-${{ runner.os }}.json"
      - name: Section 2 - reads, signing, dispatch, recovery (network denied)
        run: python tools/plan6_offline_sections.py --section 2
      - name: Section 2 exact-head non-secret qualification receipt
        run: python tools/write_ci_evidence.py --suite plan6-section2-offline --command "python tools/plan6_offline_sections.py --section 2" --output "artifacts/plan6-section2-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan6-offline-${{ runner.os }}
          path: artifacts/plan6-section*-${{ runner.os }}.json
          if-no-files-found: warn
