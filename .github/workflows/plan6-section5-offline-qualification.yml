name: Plan 6 Section 5 offline provider qualification plane

on:
  pull_request:
    paths:
      - 'tools/plan6_offline_sections.py'
      - 'mvp/tests/test_plan6_offline_qualification_plane.py'
      - '.github/workflows/plan6-section5-offline-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'tools/plan6_offline_sections.py'
      - 'mvp/tests/test_plan6_offline_qualification_plane.py'
      - '.github/workflows/plan6-section5-offline-qualification.yml'

permissions:
  contents: read

jobs:
  provider-qualification-offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    timeout-minutes: 45
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Section 5 Q/C, signature, transport, reconciliation, negative and restart qualification
        run: python tools/plan6_offline_sections.py --section 5
      - name: Exact-head non-secret offline evidence, never provider or PAPER/LIVE
        run: python tools/write_ci_evidence.py --suite plan6-section5-offline --command "python tools/plan6_offline_sections.py --section 5" --output "artifacts/plan6-section5-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan6-section5-${{ runner.os }}
          path: artifacts/plan6-section5-${{ runner.os }}.json
          if-no-files-found: warn
