name: Plan 7 terminal provider-free engineering qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/qualify_plan7_engineering.py"
      - "tools/test_qualify_plan7_engineering.py"
      - ".github/workflows/plan7-final-engineering.yml"
      - "mvp/autotrade_mvp/science_qualification.py"
      - "mvp/autotrade_mvp/evidence_class_matrix.py"
      - "mvp/autotrade_mvp/qualification_attestation.py"
      - "mvp/autotrade_mvp/performance_qualification.py"
      - "mvp/autotrade_mvp/runtime_load_*.py"
      - "mvp/autotrade_mvp/runtime_target_host_*.py"
      - "tests/Science/**"
      - "mvp/tests/test_runtime_load_*.py"
      - "mvp/tests/test_runtime_target_host_*.py"
      - "mvp/tests/test_evidence_class_matrix.py"
      - "research/autotrade_research/evaluation/ablation.py"
  push:
    branches: [main]
    paths:
      - "tools/qualify_plan7_engineering.py"
      - "tools/test_qualify_plan7_engineering.py"
      - ".github/workflows/plan7-final-engineering.yml"
      - "mvp/autotrade_mvp/science_qualification.py"
      - "mvp/autotrade_mvp/evidence_class_matrix.py"
      - "mvp/autotrade_mvp/qualification_attestation.py"
      - "mvp/autotrade_mvp/performance_qualification.py"
      - "mvp/autotrade_mvp/runtime_load_*.py"
      - "mvp/autotrade_mvp/runtime_target_host_*.py"
      - "tests/Science/**"
      - "mvp/tests/test_runtime_load_*.py"
      - "mvp/tests/test_runtime_target_host_*.py"
      - "mvp/tests/test_evidence_class_matrix.py"
      - "research/autotrade_research/evaluation/ablation.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-free-integrated-qualification:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Fail closed on source drift and tracked checkout mutation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$AUTOTRADE_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Inventory and orchestration negative and recovery regression tests
        run: |
          python tools/qualify_plan7_engineering.py --check
          python -m unittest -v tools.test_qualify_plan7_engineering
      - name: Existing science gates, self-issued PASS and failed evidence
        run: python tools/qualify_plan7_engineering.py --suite science
      - name: Existing independent ablation, causal matching and restart
        run: python tools/qualify_plan7_engineering.py --suite ablation
      - name: Existing strategy economics INCONCLUSIVE and tamper negatives
        run: python tools/qualify_plan7_engineering.py --suite economics
      - name: Existing signed trust, stale-source and TOCTOU rejects
        run: python tools/qualify_plan7_engineering.py --suite trust
      - name: Existing evidence class boundaries and no-self-promotion
        run: python tools/qualify_plan7_engineering.py --suite evidence-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
      - name: Existing load, overload, conservation and restart campaign
        run: python tools/qualify_plan7_engineering.py --suite performance
      - name: Existing target-host retained/nonterminal evidence campaign
        run: python tools/qualify_plan7_engineering.py --suite target-host
      - name: Reject changed tracked source after all qualification suites
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$AUTOTRADE_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Write exact-source receipt only after every test campaign passed
        run: >-
          python tools/write_ci_evidence.py
          --suite plan7-provider-free-final-engineering
          --command "python tools/qualify_plan7_engineering.py --check && python -m unittest -v tools.test_qualify_plan7_engineering && python tools/qualify_plan7_engineering.py --suite science && python tools/qualify_plan7_engineering.py --suite ablation && python tools/qualify_plan7_engineering.py --suite economics && python tools/qualify_plan7_engineering.py --suite trust && python tools/qualify_plan7_engineering.py --suite evidence-matrix && python tools/qualify_plan7_engineering.py --suite performance && python tools/qualify_plan7_engineering.py --suite target-host"
          --output "artifacts/plan7-final-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: plan7-provider-free-final-${{ runner.os }}
          path: artifacts/plan7-final-${{ runner.os }}.json
          if-no-files-found: error

# Receipt is repository-controllable fixture test evidence only.
# No independent economic edge, target-host physical, real provider, PAPER,
# LIVE, physical NVDA, signed release or final product qualification is issued.
