name: provider-free-product

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mvp/**"
      - "web/**"
      - "src/**"
      - "tools/plan8_m1_freeze_gate.py"
      - ".github/workflows/provider-free-product.yml"
  pull_request:
    paths:
      - "mvp/**"
      - "research/autotrade_research/**"
      - "autotrade_*/**"
      - "src/**"
      - "web/**"
      - "contracts/**"
      - "tools/build_provider_free_candidate.py"
      - "tools/release_scope_mapping.py"
      - "tools/dotnet_package_rights.py"
      - "tools/dotnet_lock.py"
      - "provenance/**"
      - "packaging/windows/**"
      - "tests/Provenance/**"
      - "tests/Product/**"
      - "tests/Host.Process/**"
      - ".github/workflows/provider-free-product.yml"

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

jobs:
  browser-scenario:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm ci --ignore-scripts
        working-directory: tests/Product
      - run: npx playwright install --with-deps chromium
        working-directory: tests/Product
      - run: python -m unittest mvp.tests.test_provider_free_product mvp.tests.test_provider_free_candidate_builder mvp.tests.test_autonomous_simulation mvp.tests.test_atomic_oms_financial_bust -v
        env:
          PYTHONPATH: research:.
      - run: npm test
        working-directory: tests/Product
      - name: Same-source keyboard semantic route/focus/history/host-outage qualification
        run: node plan5-navigation.cjs
        working-directory: tests/Product
      - run: python tools/write_ci_evidence.py --suite provider-free-whole-product-browser --command "real host + keyboard + half-fill process crash + restart + backup + restore" --output artifacts/product-browser.json
      - uses: actions/upload-artifact@v4
        with:
          name: provider-free-browser-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: artifacts/product-browser.json
          if-no-files-found: error

  windows-candidate:
    runs-on: windows-2025
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet restore src/AutoTrade.Desktop/AutoTrade.Desktop.csproj --locked-mode -r win-x64
      - run: python tools/dotnet_package_rights.py --verify-restored --packages-root "${{ env.NUGET_PACKAGES }}" --project src/AutoTrade.Desktop/AutoTrade.Desktop.csproj
      - run: dotnet publish src/AutoTrade.Desktop/AutoTrade.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore -p:SourceRevisionId=${{ env.AUTOTRADE_SOURCE_SHA }} -p:ContinuousIntegrationBuild=true -o artifacts/desktop
      - run: python tools/write_ci_evidence.py --suite provider-free-desktop-publish --command "locked self-contained win-x64 Desktop publish" --output artifacts/desktop/desktop-build-evidence.json
      - name: Bind Desktop PASS evidence to exact publish payload
        run: >-
          python -c "from pathlib import Path; from tools.build_provider_free_candidate import bind_publish_evidence; bind_publish_evidence(Path('artifacts/desktop'), executable='AutoTrade.Desktop.exe', evidence_name='desktop-build-evidence.json')"
      - run: dotnet restore src/AutoTrade.Host/AutoTrade.Host.csproj -r win-x64
      - run: dotnet publish src/AutoTrade.Host/AutoTrade.Host.csproj -c Release -r win-x64 --self-contained true --no-restore -p:SourceRevisionId=${{ env.AUTOTRADE_SOURCE_SHA }} -p:ContinuousIntegrationBuild=true -o artifacts/host
      - run: python tools/write_ci_evidence.py --suite provider-free-host-publish --command "self-contained win-x64 Host publish; default authority fail-closed" --output artifacts/host/host-build-evidence.json
      - name: Bind Host PASS evidence to exact publish payload
        run: >-
          python -c "from pathlib import Path; from tools.build_provider_free_candidate import bind_publish_evidence; bind_publish_evidence(Path('artifacts/host'), executable='AutoTrade.Host.exe', evidence_name='host-build-evidence.json')"
      - run: dotnet run --project tests/Host.Process/Host.Process.csproj -c Release
      - name: Stage rights-verified locked WebView2 SDK and exact Python input
        shell: pwsh
        run: |
          $inputs = Get-Content -Raw -LiteralPath 'packaging/windows/provider-free-inputs.json' | ConvertFrom-Json
          Invoke-WebRequest $inputs.python.url -OutFile artifacts/python.zip
          $archive = Join-Path $env:NUGET_PACKAGES "microsoft.web.webview2/$($inputs.webview2_sdk.version)/microsoft.web.webview2.$($inputs.webview2_sdk.version).nupkg"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Locked WebView2 SDK archive is missing after rights-verified restore' }
          $packageDir = Split-Path -Parent $archive
          $rawSha = Join-Path $packageDir "microsoft.web.webview2.$($inputs.webview2_sdk.version).nupkg.sha512"
          $contentMetadata = Join-Path $packageDir '.nupkg.metadata'
          foreach ($verifiedInput in @($rawSha, $contentMetadata)) {
            if (-not (Test-Path -LiteralPath $verifiedInput -PathType Leaf)) { throw 'NuGet signed-archive evidence is missing' }
          }
          dotnet nuget verify $archive --all
          if ($LASTEXITCODE -ne 0) { throw 'NuGet signed package signature verification failed' }
          Copy-Item -LiteralPath $archive -Destination 'artifacts/webview.nupkg' -ErrorAction Stop
          Copy-Item -LiteralPath $rawSha -Destination 'artifacts/webview.nupkg.sha512' -ErrorAction Stop
          Copy-Item -LiteralPath $contentMetadata -Destination 'artifacts/webview.nupkg.metadata' -ErrorAction Stop
      - name: Compose through canonical source staging and bundle builder
        run: python -m tools.build_provider_free_candidate --source-sha ${{ env.AUTOTRADE_SOURCE_SHA }} --desktop-publish artifacts/desktop --host-publish artifacts/host --python-archive artifacts/python.zip --webview-archive artifacts/webview.nupkg --work artifacts/candidate-work --output artifacts/AutoTrade-ZERO-win-x64.zip
      - run: npm ci --ignore-scripts
        working-directory: tests/Product
      - run: npx playwright install chromium
        working-directory: tests/Product
      - name: Extract the actual archive and exercise Desktop file preflight
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath artifacts/AutoTrade-ZERO-win-x64.zip -DestinationPath 'artifacts/installed candidate with spaces'
          dotnet run --project tests/Product/InventoryProbe/InventoryProbe.csproj -c Release -- 'artifacts/installed candidate with spaces/payload' --exercise
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise packaged Desktop owned-runtime bootstrap
        shell: pwsh
        run: |
          $desktopExe = (Resolve-Path 'artifacts/installed candidate with spaces/payload/AutoTrade.Desktop.exe').Path
          $data = (Join-Path (Resolve-Path 'artifacts').Path 'desktop owned runtime state')
          $start = [System.Diagnostics.ProcessStartInfo]::new($desktopExe)
          $start.UseShellExecute = $false
          $start.ArgumentList.Add('--owned-runtime-smoke')
          $start.ArgumentList.Add($data)
          $process = [System.Diagnostics.Process]::Start($start)
          if ($null -eq $process) { throw 'Packaged Desktop smoke process did not start.' }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "Packaged Desktop owned-runtime bootstrap failed: $($process.ExitCode)" }
          $process.Dispose()
      - name: Prove packaged Host fails closed before listener bind
        shell: pwsh
        run: |
          $hostExe = (Resolve-Path 'artifacts/installed candidate with spaces/payload/host/AutoTrade.Host.exe').Path
          $stderr = 'artifacts/host-startup-blocked.txt'
          & $hostExe 2> $stderr
          if ($LASTEXITCODE -ne 78) { throw "Packaged Host did not return authority-unavailable exit 78: $LASTEXITCODE" }
          if (-not (Select-String -LiteralPath $stderr -Pattern 'AUTOTRADE_HOST_STARTUP_BLOCKED' -Quiet)) { throw 'Packaged Host did not emit the fail-closed startup marker.' }
      - name: Test the extracted isolated Python and frozen product with keyboard
        shell: pwsh
        run: |
          $env:AUTOTRADE_PYTHON = (Resolve-Path 'artifacts/installed candidate with spaces/payload/runtime/python/python.exe').Path
          $env:AUTOTRADE_PRODUCT_ROOT = (Resolve-Path 'artifacts/installed candidate with spaces/payload/product').Path
          node tests/Product/provider-free-browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Product/InventoryProbe/InventoryProbe.csproj -c Release -- 'artifacts/installed candidate with spaces/payload'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python tools/write_ci_evidence.py --suite provider-free-packaged-windows-browser --command "packaged Desktop owned-runtime bootstrap + embedded isolated Python + packaged fail-closed Host + keyboard + crash + restart + backup + restore" --output artifacts/product-packaged-Windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTrade-ZERO-UNQUALIFIED-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: |
            artifacts/AutoTrade-ZERO-win-x64.zip
            artifacts/AutoTrade-ZERO-win-x64.zip.sha256
            artifacts/product-packaged-Windows.json
            artifacts/host-startup-blocked.txt
            artifacts/candidate-work/candidate-result.json
          if-no-files-found: error

  m1-recovery-negative-qualification:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Exact-source real-product restore and fail-closed crash/recovery suite
        run: >-
          python -m unittest
          mvp.tests.test_plan8_m1_recovery_continuation
          mvp.tests.test_simulation_runtime_checkpoint
          mvp.tests.test_backup_restore
          mvp.tests.test_recovery_durable_unknown_restart
          mvp.tests.test_recovery_takeover_source_sender_fence
          mvp.tests.test_persistence_hard_crash
          mvp.tests.test_simulation_bootstrap_whole_store_cas
          mvp.tests.test_shared_store_zero_checkpoint_outbox
          -v
        env:
          PYTHONPATH: research:.
      - run: python tools/write_ci_evidence.py --suite plan8-m1-s4-crash-restore-financial-conservation --command "real Host restore/recover/restart, backup/checkpoint/UNKNOWN/split-brain/sender-fence/crash negatives" --output artifacts/m1-s4-recovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan8-m1-s4-recovery-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: artifacts/m1-s4-recovery.json
          if-no-files-found: error

  m1-s5-source-web-update-load:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Exact frozen source and clean tracked files
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$AUTOTRADE_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Real same-origin Host/Web composition plus source accessibility and Desktop parity
        run: >-
          python -m unittest
          mvp.tests.test_plan8_m1_s5_composed_surface
          mvp.tests.test_plan5_terminal_source_contract
          mvp.tests.test_semantic_web_client_contract
          mvp.tests.test_desktop_shell_contract
          mvp.tests.test_embedded_web
          mvp.tests.test_accessible_status
          -v
        env:
          PYTHONPATH: research:.
      - name: Canonical update/rollback, installed fixture and fail-closed security negatives
        run: >-
          python -m unittest
          mvp.tests.test_windows_update
          mvp.tests.test_windows_update_intent
          mvp.tests.test_windows_fixture_install_assembly
          mvp.tests.test_windows_bundle
          mvp.tests.test_windows_install_manifest
          mvp.tests.test_runtime_locality_packaging
          -v
        env:
          PYTHONPATH: research:.
      - name: Reuse Plan 7 source load/budget and event-conservation negative tests
        run: >-
          python -m unittest
          mvp.tests.test_performance_qualification
          mvp.tests.test_runtime_resource_budget
          -v
        env:
          PYTHONPATH: research:.
      - name: Reuse durable restart/backlog, slow disk and target-host load evidence tests
        shell: bash
        run: |
          PYTHONPATH=research:. python -m unittest discover -s mvp/tests -p 'test_runtime_load_*.py' -v
          PYTHONPATH=research:. python -m unittest discover -s mvp/tests -p 'test_runtime_target_host_*.py' -v
      - name: Evidence only after actual source/update/load execution succeeds
        run: >-
          python tools/write_ci_evidence.py
          --suite plan8-m1-s5-web-desktop-update-load
          --command "real ZERO Host immutable Web, Desktop source parity, update rollback, fail closed, durable load and target-host fixture suites"
          --output artifacts/m1-s5-surface-load.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan8-m1-s5-surface-load-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: artifacts/m1-s5-surface-load.json
          if-no-files-found: error

  m1-s5-composed-gate:
    runs-on: ubuntu-22.04
    needs:
      - browser-scenario
      - windows-candidate
      - m1-recovery-negative-qualification
      - m1-s5-source-web-update-load
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Refuse mismatched source after same-run successful upstream product gates
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$AUTOTRADE_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Retain NON-RELEASE whole-product engineering gate only after all needed jobs succeed
        run: >-
          python tools/write_ci_evidence.py
          --suite plan8-m1-s5-composed-engineering
          --command "same source CI run: real Host keyboard browser, Windows installed provider-free candidate, crash/restore, accessibility/update/rollback and load suites"
          --output artifacts/m1-s5-composed.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan8-m1-s5-composed-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: artifacts/m1-s5-composed.json
          if-no-files-found: error
      - name: Remain explicit about unavailable external release evidence
        run: echo 'SOURCE/CI ENGINEERING ONLY; no signed release, physical NVDA, target-host performance, real provider, PAPER/LIVE or profitability asserted'

  m1-s6-terminal-freeze:
    runs-on: ubuntu-22.04
    needs:
      - m1-s5-composed-gate
      - windows-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Fail-closed M1 freeze contract fixture and negative tests
        run: python -m unittest mvp.tests.test_plan8_m1_freeze_gate -v
        env:
          PYTHONPATH: research:.
      - uses: actions/download-artifact@v4
        with:
          name: AutoTrade-ZERO-UNQUALIFIED-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: artifacts/freeze/windows
      - uses: actions/download-artifact@v4
        with:
          name: provider-free-browser-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: artifacts/freeze/browser
      - uses: actions/download-artifact@v4
        with:
          name: plan8-m1-s4-recovery-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: artifacts/freeze/recovery
      - uses: actions/download-artifact@v4
        with:
          name: plan8-m1-s5-surface-load-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: artifacts/freeze/surface
      - uses: actions/download-artifact@v4
        with:
          name: plan8-m1-s5-composed-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: artifacts/freeze/composed
      - name: Verify exact source/tree/package/hash/same-run PASS evidence without release assertion
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$AUTOTRADE_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          python tools/plan8_m1_freeze_gate.py \
            --source-sha "$AUTOTRADE_SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --windows artifacts/freeze/windows \
            --browser artifacts/freeze/browser/product-browser.json \
            --recovery artifacts/freeze/recovery/m1-s4-recovery.json \
            --surface artifacts/freeze/surface/m1-s5-surface-load.json \
            --composed artifacts/freeze/composed/m1-s5-composed.json \
            --output artifacts/freeze/m1-s6-nonrelease-freeze.json
        env:
          PYTHONPATH: research:.
      - name: Issue same-source non-release engineering evidence only after all real jobs passed
        run: >-
          python tools/write_ci_evidence.py
          --suite plan8-m1-s6-exact-source-freeze
          --command "same-run actual browser, Windows, recovery, accessibility, update, load, verified bundle/source/tree and denied release authority"
          --output artifacts/freeze/m1-s6-execution-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan8-m1-s6-nonrelease-freeze-${{ env.AUTOTRADE_SOURCE_SHA }}
          path: |
            artifacts/freeze/m1-s6-nonrelease-freeze.json
            artifacts/freeze/m1-s6-execution-evidence.json
          if-no-files-found: error
