name: provider-origin-store-dispatch-implementation

on:
  push:
    branches:
      - wp18/provider-origin-store-authority-0a48-sol56
    paths:
      - .github/scripts/provider_origin_store_dispatch_patch.py
      - .github/workflows/provider-origin-store-dispatch-implementation.yml

permissions:
  contents: write

concurrency:
  group: provider-origin-store-dispatch-implementation
  cancel-in-progress: true

jobs:
  implement-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Apply retained provider-origin store authority
        run: python .github/scripts/provider_origin_store_dispatch_patch.py
      - name: Compile provider-origin production module
        run: python -m py_compile mvp/autotrade_mvp/provider_origin.py
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Prove store dispatch falsifiers
        run: python -m unittest mvp.tests.test_provider_origin_store_dispatch_authority -v
      - name: Prove provider-origin regressions
        run: python -m unittest mvp.tests.test_provider_origin -v
      - name: Prove provider-origin qualification regressions
        run: python -m unittest mvp.tests.test_provider_origin_qualification -v
      - name: Commit bounded production repair and retire worker
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/provider-origin-store-dispatch-implementation.yml
          git rm .github/scripts/provider_origin_store_dispatch_patch.py
          git add mvp/autotrade_mvp/provider_origin.py
          git commit -m 'Fix: retain provider-origin store dispatch authority'
          git push origin HEAD:wp18/provider-origin-store-authority-0a48-sol56
