name: reconvergence-integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event base is still live target tip
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          live_line="$(git ls-remote --refs origin "refs/heads/${BASE_REF}")"
          test -n "$live_line"
          read -r live_sha _ <<< "$live_line"
          test -n "$live_sha"
          test "$live_sha" = "$BASE_SHA"
      - name: Fetch exact candidate revision without checking it out
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
      - name: Resolve one-time trusted exact-head mutation scope
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED_SCOPE_FILE: ${{ runner.temp }}/autotrade-reconvergence-bootstrap-scopes.txt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import urllib.parse
          import urllib.request

          MARKER = "AUTOTRADE_RECONVERGENCE_SCOPE_V1"
          SHA40 = re.compile(r"^[0-9a-f]{40}$")

          def canonical_path(value: object) -> str:
              if not isinstance(value, str) or not value:
                  raise RuntimeError("approved scope path must be non-empty text")
              if (
                  value.startswith("/")
                  or "\\" in value
                  or ":" in value
                  or any(ch in value for ch in ("\x00", "\n", "\r"))
              ):
                  raise RuntimeError(
                      "approved scope path must be canonical repository-relative text"
                  )
              if any(part in {"", ".", ".."} for part in value.split("/")):
                  raise RuntimeError("approved scope path contains invalid segment")
              return value

          def parse_record(body: object, expected_head: str):
              if not isinstance(body, str):
                  return None
              lines = body.splitlines()
              if not lines or lines[0].strip() != MARKER:
                  return None
              if not SHA40.fullmatch(expected_head):
                  raise RuntimeError("event head is not lowercase 40-hex")
              if len(lines) < 2 or not lines[1].startswith("head: "):
                  raise RuntimeError("scope approval requires exact head line")
              approved_head = lines[1].removeprefix("head: ").strip()
              if not SHA40.fullmatch(approved_head):
                  raise RuntimeError("approved head must be lowercase 40-hex")
              if approved_head != expected_head:
                  return None
              if len(lines) < 3:
                  raise RuntimeError("current-head approval requires at least one path")
              paths = []
              for line in lines[2:]:
                  if not line.startswith("path: "):
                      raise RuntimeError(
                          "current-head approval permits only path lines after head"
                      )
                  paths.append(
                      canonical_path(line.removeprefix("path: ").strip())
                  )
              if len(set(paths)) != len(paths):
                  raise RuntimeError(
                      "current-head approval must not repeat exact paths"
                  )
              return tuple(paths)

          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          target = Path(os.environ["APPROVED_SCOPE_FILE"])
          approved = []
          seen = set()
          page = 1
          while True:
              query = urllib.parse.urlencode({"per_page": 100, "page": page})
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/issues/{pr_number}/comments?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  comments = json.load(response)
              if not isinstance(comments, list):
                  raise RuntimeError("GitHub issue comments response must be a list")
              for comment in comments:
                  if comment.get("author_association") != "OWNER":
                      continue
                  parsed = parse_record(comment.get("body"), head_sha)
                  if parsed is not None:
                      for path in parsed:
                          if path not in seen:
                              seen.add(path)
                              approved.append(path)
              if len(comments) < 100:
                  break
              page += 1

          bootstrap_paths = {
              ".github/workflows/reconvergence-integrity.yml",
              "control/tools/reconvergence_integrity.py",
              "tests/Control/test_reconvergence_integrity.py",
              "tests/Control/test_reconvergence_integrity_entrypoint.py",
              "tests/Control/test_reconvergence_integrity_security_regressions.py",
              "tests/Control/test_reconvergence_workflow_authority.py",
          }
          frozen_authority_paths = {
              "control/__init__.py",
              "control/tools/__init__.py",
              "control/tools/registry_state.py",
              "Directory.Build.props",
              "Directory.Build.targets",
              "global.json",
              "requirements-dev.txt",
              "contracts/fixtures/common-scalars.corpus.json",
              "tests/Contracts.DotNet/Contracts.DotNet.csproj",
              "tests/Contracts.DotNet/Program.cs",
              "tests/Desktop.Client/Desktop.Client.csproj",
              "tests/Desktop.Client/Program.cs",
              "tools/baseline.py",
              "tools/build_provenance_manifest.py",
              "tools/check_nvda_qualification.py",
              "tools/verify.py",
              "tools/write_ci_evidence.py",
          }
          base_sha = os.environ["BASE_SHA"]
          changed = {
              line
              for line in subprocess.run(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      "--no-renames",
                      base_sha,
                      head_sha,
                  ],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              ).stdout.splitlines()
              if line
          }
          for path in changed:
              canonical_path(path)
          other_authority = {
              path
              for path in changed
              if (
                  (
                      path.startswith(".github/workflows/")
                      and path not in bootstrap_paths
                  )
                  or path in frozen_authority_paths
              )
          }
          if other_authority:
              raise RuntimeError(
                  "non-bootstrap trust authority is frozen until terminal guard integration: "
                  + ", ".join(sorted(other_authority))
              )

          sensitive = changed.intersection(bootstrap_paths)
          approved_set = set(approved)
          if sensitive:
              outside = changed - bootstrap_paths
              if outside:
                  raise RuntimeError(
                      "trust-root bootstrap candidate contains out-of-scope paths: "
                      + ", ".join(sorted(outside))
                  )
              if approved_set != changed:
                  raise RuntimeError(
                      "current-head OWNER approval must exactly equal the bounded "
                      "bootstrap candidate path set"
                  )
          elif approved_set:
              raise RuntimeError(
                  "OWNER bootstrap scope is forbidden for a candidate without "
                  "bootstrap-sensitive paths"
              )

          approved = sorted(approved_set)
          target.write_text(
              "".join(f"{path}\n" for path in approved),
              encoding="utf-8",
          )
          print(
              f"Resolved {len(approved)} exact bounded current-head scope path(s)."
          )
          PY
      - name: Guard pull-request repository tree with trusted base code
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED_SCOPE_FILE: ${{ runner.temp }}/autotrade-reconvergence-bootstrap-scopes.txt
        run: |
          set -euo pipefail
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          while IFS= read -r scope; do
            test -n "$scope"
            args+=(--allowed-scope "$scope")
          done < "$APPROVED_SCOPE_FILE"
          python -m control.tools.reconvergence_integrity "${args[@]}"
      - name: Run trusted guard regression tests
        run: python -m unittest tests.Control.test_reconvergence_integrity -v
      - name: Reverify one-time trusted exact-head mutation scope
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED_SCOPE_FILE: ${{ runner.temp }}/autotrade-reconvergence-bootstrap-scopes.txt
          RECHECK_SCOPE_FILE: ${{ runner.temp }}/autotrade-reconvergence-bootstrap-scopes-recheck.txt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import urllib.parse
          import urllib.request

          MARKER = "AUTOTRADE_RECONVERGENCE_SCOPE_V1"
          SHA40 = re.compile(r"^[0-9a-f]{40}$")

          def canonical_path(value: object) -> str:
              if not isinstance(value, str) or not value:
                  raise RuntimeError("approved scope path must be non-empty text")
              if (
                  value.startswith("/")
                  or "\\" in value
                  or ":" in value
                  or any(ch in value for ch in ("\x00", "\n", "\r"))
              ):
                  raise RuntimeError(
                      "approved scope path must be canonical repository-relative text"
                  )
              if any(part in {"", ".", ".."} for part in value.split("/")):
                  raise RuntimeError("approved scope path contains invalid segment")
              return value

          def parse_record(body: object, expected_head: str):
              if not isinstance(body, str):
                  return None
              lines = body.splitlines()
              if not lines or lines[0].strip() != MARKER:
                  return None
