name: reconvergence-integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact candidate revision without checking it out
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: |
          git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}"
          git cat-file -e "${{ github.event.pull_request.head.sha }}^{commit}"
      - name: Verify target branch tip matches event base
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          target_tip="$(git ls-remote origin "refs/heads/${BASE_REF}" | awk '{print $1}')"
          test -n "$target_tip"
          test "$target_tip" = "$EVENT_BASE_SHA"
      - name: Resolve trusted protected-sentinel path authorization
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$AUTHOR_LOGIN" = "$REPOSITORY_OWNER" ]; then
            {
              printf '%s\n' 'AUTOTRADE_TRUSTED_PROTECTED_SENTINEL_PATHS<<__AUTOTRADE_PROTECTED_PATHS__'
              printf '%s\n' '.github/workflows/reconvergence-integrity.yml'
              printf '%s\n' 'control/tools/reconvergence_integrity.py'
              printf '%s\n' '__AUTOTRADE_PROTECTED_PATHS__'
            } >> "$GITHUB_ENV"
          else
            echo 'AUTOTRADE_TRUSTED_PROTECTED_SENTINEL_PATHS=' >> "$GITHUB_ENV"
          fi
      - name: Guard pull-request repository tree with trusted base code
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: >-
          python -m control.tools.reconvergence_integrity
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Run trusted guard regression tests
        run: python -m unittest tests.Control.test_reconvergence_integrity -v
