name: reconvergence-integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event base is still exact live target tip
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          AUTOTRADE_EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTOTRADE_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          live_target="$(git ls-remote --refs origin "refs/heads/${AUTOTRADE_EVENT_BASE_REF}")"
          test -n "${live_target}"
          test "$(printf '%s\n' "${live_target}" | wc -l)" -eq 1
          read -r live_target_sha live_target_ref <<< "${live_target}"
          test "${live_target_ref}" = "refs/heads/${AUTOTRADE_EVENT_BASE_REF}"
          test "${live_target_sha}" = "${AUTOTRADE_EVENT_BASE_SHA}"
      - name: Fetch exact candidate revision without checking it out
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: |
          git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}"
          git cat-file -e "${{ github.event.pull_request.head.sha }}^{commit}"
      - name: Guard pull-request repository tree with trusted base code
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: >-
          python -m control.tools.reconvergence_integrity
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Run trusted guard regression tests
        run: python -m unittest tests.Control.test_reconvergence_integrity -v
