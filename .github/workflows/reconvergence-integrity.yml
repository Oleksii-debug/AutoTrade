              raise RuntimeError(
                  "OWNER bootstrap scope is forbidden for a candidate without "
                  "bootstrap-sensitive paths"
              )

          approved = sorted(approved_set)
          target.write_text(
              "".join(f"{path}\n" for path in approved),
              encoding="utf-8",
          )
          if target.read_bytes() != original.read_bytes():
              raise RuntimeError(
                  "trusted exact-head mutation scope changed during guard run"
              )
          print(f"Reverified {len(approved)} unchanged scope path(s).")
          PY
      - name: Reverify event base is still live target tip
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          live_line="$(git ls-remote --refs origin "refs/heads/${BASE_REF}")"
          test -n "$live_line"
          read -r live_sha _ <<< "$live_line"
          test -n "$live_sha"
          test "$live_sha" = "$BASE_SHA"
