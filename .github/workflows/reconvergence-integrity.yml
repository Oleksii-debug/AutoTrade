name: reconvergence-integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure exact pull-request revisions are available
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}"
          git cat-file -e "${{ github.event.pull_request.head.sha }}^{commit}"
      - name: Guard pull-request repository tree
        if: github.event_name == 'pull_request'
        shell: bash
        run: >-
          python control/tools/reconvergence_integrity.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --pull-request-event "$GITHUB_EVENT_PATH"
      - name: Run guard regression tests
        run: python -m unittest tests.Control.test_reconvergence_integrity -v
