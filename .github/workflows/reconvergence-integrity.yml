name: reconvergence-integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact candidate revision without checking it out
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: |
          git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}"
          git cat-file -e "${{ github.event.pull_request.head.sha }}^{commit}"
      - name: Resolve trusted protected-sentinel modification authorization
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$AUTHOR_LOGIN" = "$REPOSITORY_OWNER" ]; then
            echo "AUTOTRADE_TRUSTED_PROTECTED_SENTINEL_MODIFICATION=1" >> "$GITHUB_ENV"
          else
            echo "AUTOTRADE_TRUSTED_PROTECTED_SENTINEL_MODIFICATION=0" >> "$GITHUB_ENV"
          fi
      - name: Guard pull-request repository tree with trusted base code
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: >-
          python -m control.tools.reconvergence_integrity
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          $([ "${AUTOTRADE_TRUSTED_PROTECTED_SENTINEL_MODIFICATION:-0}" = "1" ] && printf '%s' "--allow-protected-sentinel-modification")
      - name: Run trusted guard regression tests
        run: python -m unittest tests.Control.test_reconvergence_integrity -v
