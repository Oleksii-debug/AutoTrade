                  raise RuntimeError("event head is not lowercase 40-hex")
              if len(lines) < 2 or not lines[1].startswith("head: "):
                  raise RuntimeError("scope approval requires exact head line")
              approved_head = lines[1].removeprefix("head: ").strip()
              if not SHA40.fullmatch(approved_head):
                  raise RuntimeError("approved head must be lowercase 40-hex")
              if approved_head != expected_head:
                  return None
              if len(lines) < 3:
                  raise RuntimeError("current-head approval requires at least one path")
              paths = []
              for line in lines[2:]:
                  if not line.startswith("path: "):
                      raise RuntimeError(
                          "current-head approval permits only path lines after head"
                      )
                  paths.append(
                      canonical_path(line.removeprefix("path: ").strip())
                  )
              if len(set(paths)) != len(paths):
                  raise RuntimeError(
                      "current-head approval must not repeat exact paths"
                  )
              return tuple(paths)

          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          original = Path(os.environ["APPROVED_SCOPE_FILE"])
          target = Path(os.environ["RECHECK_SCOPE_FILE"])
          approved = []
          seen = set()
          page = 1
          while True:
              query = urllib.parse.urlencode({"per_page": 100, "page": page})
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/issues/{pr_number}/comments?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  comments = json.load(response)
              if not isinstance(comments, list):
                  raise RuntimeError("GitHub issue comments response must be a list")
              for comment in comments:
                  if comment.get("author_association") != "OWNER":
                      continue
                  parsed = parse_record(comment.get("body"), head_sha)
                  if parsed is not None:
                      for path in parsed:
                          if path not in seen:
                              seen.add(path)
                              approved.append(path)
              if len(comments) < 100:
                  break
              page += 1

          bootstrap_paths = {
              ".github/workflows/reconvergence-integrity.yml",
              "control/tools/reconvergence_integrity.py",
              "tests/Control/test_reconvergence_integrity.py",
              "tests/Control/test_reconvergence_integrity_entrypoint.py",
              "tests/Control/test_reconvergence_integrity_security_regressions.py",
              "tests/Control/test_reconvergence_workflow_authority.py",
          }
          frozen_authority_paths = {
              "control/__init__.py",
              "control/tools/__init__.py",
              "control/tools/registry_state.py",
              "Directory.Build.props",
              "Directory.Build.targets",
              "global.json",
              "requirements-dev.txt",
              "contracts/fixtures/common-scalars.corpus.json",
              "tests/Contracts.DotNet/Contracts.DotNet.csproj",
              "tests/Contracts.DotNet/Program.cs",
              "tests/Desktop.Client/Desktop.Client.csproj",
              "tests/Desktop.Client/Program.cs",
              "tools/baseline.py",
              "tools/build_provenance_manifest.py",
              "tools/check_nvda_qualification.py",
              "tools/verify.py",
              "tools/write_ci_evidence.py",
          }
          base_sha = os.environ["BASE_SHA"]
          changed = {
              line
              for line in subprocess.run(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      "--no-renames",
                      base_sha,
                      head_sha,
                  ],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              ).stdout.splitlines()
              if line
          }
          for path in changed:
              canonical_path(path)
          other_authority = {
              path
              for path in changed
              if (
                  (
                      path.startswith(".github/workflows/")
                      and path not in bootstrap_paths
                  )
                  or path in frozen_authority_paths
              )
          }
          if other_authority:
              raise RuntimeError(
                  "non-bootstrap trust authority is frozen until terminal guard integration: "
                  + ", ".join(sorted(other_authority))
              )

          sensitive = changed.intersection(bootstrap_paths)
          approved_set = set(approved)
          if sensitive:
              outside = changed - bootstrap_paths
