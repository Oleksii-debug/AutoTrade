name: reconvergence-integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact candidate revision without checking it out
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: |
          git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}"
          git cat-file -e "${{ github.event.pull_request.head.sha }}^{commit}"
      - name: Verify target branch tip matches event base
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          target_tip="$(git ls-remote origin "refs/heads/${BASE_REF}" | awk '{print $1}')"
          test -n "$target_tip"
          test "$target_tip" = "$EVENT_BASE_SHA"
      - name: Resolve externally approved exact trust-root paths
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED_SCOPE_FILE: ${{ runner.temp }}/autotrade-reconvergence-trust-roots.txt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request

          from control.tools.reconvergence_integrity import parse_trusted_scope_approval

          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          target = Path(os.environ["APPROVED_SCOPE_FILE"])
          approved = []
          seen = set()
          page = 1
          while True:
              query = urllib.parse.urlencode({"per_page": 100, "page": page})
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/issues/{pr_number}/comments?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  comments = json.load(response)
              if not isinstance(comments, list):
                  raise RuntimeError("GitHub issue comments response must be a list")
              for comment in comments:
                  if comment.get("author_association") != "OWNER":
                      continue
                  parsed = parse_trusted_scope_approval(
                      comment.get("body"),
                      expected_head_sha=head_sha,
                  )
                  if parsed is not None:
                      for path in parsed:
                          if path not in seen:
                              seen.add(path)
                              approved.append(path)
              if len(comments) < 100:
                  break
              page += 1

          target.write_text(
              "".join(f"{path}\n" for path in approved),
              encoding="utf-8",
          )
          print(f"Resolved {len(approved)} external exact-head trust-root approval(s).")
          PY
      - name: Guard pull-request repository tree with trusted base code
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED_SCOPE_FILE: ${{ runner.temp }}/autotrade-reconvergence-trust-roots.txt
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          while IFS= read -r path; do
            test -n "$path"
            args+=(--trusted-root-approval "$path")
          done < "$APPROVED_SCOPE_FILE"
          python -m control.tools.reconvergence_integrity "${args[@]}"
      - name: Run trusted guard regression tests
        run: python -m unittest tests.Control.test_reconvergence_integrity -v
      - name: Reverify external exact-head trust-root approvals are unchanged
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED_SCOPE_FILE: ${{ runner.temp }}/autotrade-reconvergence-trust-roots.txt
          RECHECK_SCOPE_FILE: ${{ runner.temp }}/autotrade-reconvergence-trust-roots-recheck.txt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request

          from control.tools.reconvergence_integrity import parse_trusted_scope_approval

          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          original = Path(os.environ["APPROVED_SCOPE_FILE"])
          target = Path(os.environ["RECHECK_SCOPE_FILE"])
          approved = []
          seen = set()
          page = 1
          while True:
              query = urllib.parse.urlencode({"per_page": 100, "page": page})
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/issues/{pr_number}/comments?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  comments = json.load(response)
              if not isinstance(comments, list):
                  raise RuntimeError("GitHub issue comments response must be a list")
              for comment in comments:
                  if comment.get("author_association") != "OWNER":
                      continue
                  parsed = parse_trusted_scope_approval(
                      comment.get("body"),
                      expected_head_sha=head_sha,
                  )
                  if parsed is not None:
                      for path in parsed:
                          if path not in seen:
                              seen.add(path)
                              approved.append(path)
              if len(comments) < 100:
                  break
              page += 1

          target.write_text(
              "".join(f"{path}\n" for path in approved),
              encoding="utf-8",
          )
          if target.read_bytes() != original.read_bytes():
              raise RuntimeError(
                  "trusted exact-head trust-root approval changed during guard run"
              )
          PY
      - name: Reverify target branch tip still matches event base
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          target_tip="$(git ls-remote origin "refs/heads/${BASE_REF}" | awk '{print $1}')"
          test -n "$target_tip"
          test "$target_tip" = "$EVENT_BASE_SHA"
