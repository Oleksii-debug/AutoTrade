name: research-primitives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/research-primitives.yml"
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/research-primitives.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: research/pyproject.toml
      - name: Install research package
        run: python -m pip install -e "research[test]"
      - name: Run migrated primitive tests
        run: python -m unittest discover -s research/tests -v
