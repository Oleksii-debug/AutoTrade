name: research-primitives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "autotrade_numeric/**"
      - "pyproject.toml"
      - "mvp/autotrade_mvp/exact_decimal.py"
      - "tools/generate_common_scalar_bindings.py"
      - "contracts/jsonschema/common.schema.json"
      - "research/**"
      - "requirements-dev.txt"
      - "provenance/reuse/autosport-neutral-primitives.json"
      - ".github/workflows/research-primitives.yml"
  pull_request:
    paths:
      - "autotrade_numeric/**"
      - "pyproject.toml"
      - "mvp/autotrade_mvp/exact_decimal.py"
      - "tools/generate_common_scalar_bindings.py"
      - "contracts/jsonschema/common.schema.json"
      - "research/**"
      - "requirements-dev.txt"
      - "provenance/reuse/autosport-neutral-primitives.json"
      - ".github/workflows/research-primitives.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12.10"]
    runs-on: ${{ matrix.os }}
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
            research/pyproject.toml
      - name: Install exact research test dependencies
        run: "python -m pip install --disable-pip-version-check --force-reinstall --no-deps --only-binary=:all: --require-hashes -r requirements-dev.txt"
      - name: Install locally shared exact numeric package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Install research package
        run: python -m pip install --no-deps --no-build-isolation -e research
      - name: Run research and migrated primitive tests
        run: python -m unittest discover -s research/tests -v
      - name: Write exact-head WP-04 evidence
        run: python tools/write_ci_evidence.py --suite wp04-neutral-reuse --command "python -m unittest discover -s research/tests -v" --output "artifacts/wp04-neutral-reuse-${{ runner.os }}.json"
      - name: Upload exact-head WP-04 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp04-neutral-reuse-evidence-${{ runner.os }}
          path: artifacts/wp04-neutral-reuse-${{ runner.os }}.json
          if-no-files-found: error
