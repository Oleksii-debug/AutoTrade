name: research-primitives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "autotrade_numeric/**"
      - "pyproject.toml"
      - "mvp/autotrade_mvp/exact_decimal.py"
      - "tools/generate_common_scalar_bindings.py"
      - "contracts/jsonschema/common.schema.json"
      - "research/**"
      - "autotrade_runtime/**"
      - "mvp/autotrade_mvp/alpha_*.py"
      - "mvp/tests/test_alpha_*.py"
      - "tools/run_whitebit_alpha_research.py"
      - "requirements-dev.txt"
      - "provenance/reuse/autosport-neutral-primitives.json"
      - ".github/workflows/research-primitives.yml"
  pull_request:
    paths:
      - "autotrade_numeric/**"
      - "pyproject.toml"
      - "mvp/autotrade_mvp/exact_decimal.py"
      - "tools/generate_common_scalar_bindings.py"
      - "contracts/jsonschema/common.schema.json"
      - "research/**"
      - "autotrade_runtime/**"
      - "mvp/autotrade_mvp/alpha_*.py"
      - "mvp/tests/test_alpha_*.py"
      - "tools/run_whitebit_alpha_research.py"
      - "requirements-dev.txt"
      - "provenance/reuse/autosport-neutral-primitives.json"
      - ".github/workflows/research-primitives.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
        python-version: ["3.12.10"]
    runs-on: ${{ matrix.os }}
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
            research/pyproject.toml
      - name: Install exact research test dependencies
        run: "python -m pip install --disable-pip-version-check --force-reinstall --no-deps --only-binary=:all: --require-hashes -r requirements-dev.txt"
      - name: Install locally shared exact numeric package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Install research package
        run: python -m pip install --no-deps --no-build-isolation -e research
      - name: Run research and migrated primitive tests
        run: python -m unittest discover -s research/tests -v
      - name: Write exact-head WP-04 evidence
        run: python tools/write_ci_evidence.py --suite wp04-neutral-reuse --command "python -m unittest discover -s research/tests -v" --output "artifacts/wp04-neutral-reuse-${{ runner.os }}.json"
      - name: Upload exact-head WP-04 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp04-neutral-reuse-evidence-${{ runner.os }}
          path: artifacts/wp04-neutral-reuse-${{ runner.os }}.json
          if-no-files-found: error

  alpha-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install canonical core dependencies
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.txt"
      - name: Install the selected CPU PyTorch backend
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Install the existing optional alpha versions
        run: python -m pip install --disable-pip-version-check -r research/optional-alpha-requirements.txt
      - name: Exercise actual native model persistence and durable recovery
        shell: bash
        run: |
          PYTHONPATH="$PWD/research:$PWD" python -B - <<'PY'
          import json
          import os
          from importlib.metadata import version
          from pathlib import Path
          import subprocess
          import unittest
          import torch
          expected = {"numpy": "2.3.5", "xgboost": "3.1.3", "catboost": "1.2.8",
                      "torch": "2.10.0", "shap": "0.50.0"}
          actual = {name: version(name) for name in expected}
          for name, required in expected.items():
              if actual[name].split("+", 1)[0] != required:
                  raise SystemExit(f"{name} version differs: {actual[name]}")
          if torch.version.cuda is not None:
              raise SystemExit("The alpha qualification job requires CPU PyTorch")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != os.environ["AUTOTRADE_SOURCE_SHA"]:
              raise SystemExit("Checked-out source differs from the requested revision")
          names = ["research.tests.test_alpha_research",
                   "research.tests.test_alpha_model_persistence",
                   "mvp.tests.test_alpha_dag_binding",
                   "mvp.tests.test_alpha_research_worker"]
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(names))
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit("Native alpha qualification requires success with zero skipped tests")
          evidence = {"source_sha": head, "native_versions": actual,
                      "test_modules": names, "tests_run": result.testsRun,
                      "failures": len(result.failures), "errors": len(result.errors),
                      "skipped": len(result.skipped), "live_authority": False,
                      "automatic_promotion": False}
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/alpha-native.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
      - name: Upload native alpha execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: alpha-native-evidence
          path: artifacts/alpha-native.json
          if-no-files-found: error
