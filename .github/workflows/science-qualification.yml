name: science-qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mvp/autotrade_mvp/science_qualification.py"
      - "mvp/autotrade_mvp/allocation.py"
      - "mvp/autotrade_mvp/allocation_valuation.py"
      - "mvp/autotrade_mvp/lifecycle_cost.py"
      - "mvp/autotrade_mvp/simulation_session.py"
      - "mvp/tests/test_lifecycle_cost_*.py"
      - "qualification/strategy_economics/**"
      - "research/autotrade_research/strategies/**"
      - "tests/Science/**"
      - "research/autotrade_research/learning/**"
      - "research/autotrade_research/memory/episodes.py"
      - ".github/workflows/science-qualification.yml"
  pull_request:
    paths:
      - "mvp/autotrade_mvp/science_qualification.py"
      - "mvp/autotrade_mvp/allocation.py"
      - "mvp/autotrade_mvp/allocation_valuation.py"
      - "mvp/autotrade_mvp/lifecycle_cost.py"
      - "mvp/autotrade_mvp/simulation_session.py"
      - "mvp/tests/test_lifecycle_cost_*.py"
      - "qualification/strategy_economics/**"
      - "research/autotrade_research/strategies/**"
      - "tests/Science/**"
      - "research/autotrade_research/learning/**"
      - "research/autotrade_research/memory/episodes.py"
      - ".github/workflows/science-qualification.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
        python-version: ["3.12.10"]
    runs-on: ${{ matrix.os }}
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run scientific qualification tests
        run: python -m unittest discover -s tests/Science -p "test_*.py" -v
      - name: Write exact-head science evidence
        run: python tools/write_ci_evidence.py --suite science-qualification --command "python -m unittest discover -s tests/Science -p test_*.py -v" --output "artifacts/science-qualification-${{ runner.os }}.json"
      - name: Upload exact-head science evidence
        uses: actions/upload-artifact@v4
        with:
          name: science-qualification-evidence-${{ runner.os }}
          path: artifacts/science-qualification-${{ runner.os }}.json
          if-no-files-found: error
