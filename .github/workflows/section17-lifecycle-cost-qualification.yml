name: section17-lifecycle-cost-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mvp/autotrade_mvp/lifecycle_cost*.py"
      - "mvp/autotrade_mvp/simulation_session.py"
      - "mvp/tests/test_lifecycle_cost*.py"
      - "qualification/strategy_economics/**"
      - "tests/Science/test_strategy_economics_authority.py"
      - ".github/workflows/section17-lifecycle-cost-qualification.yml"
  push:
    branches: [main]
    paths:
      - "mvp/autotrade_mvp/lifecycle_cost*.py"
      - "mvp/autotrade_mvp/simulation_session.py"
      - "mvp/tests/test_lifecycle_cost*.py"
      - "qualification/strategy_economics/**"
      - "tests/Science/test_strategy_economics_authority.py"
      - ".github/workflows/section17-lifecycle-cost-qualification.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-cost:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      PYTHONPATH: ${{ github.workspace }}/research
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
          fetch-depth: 0
      - name: Preserve exact source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --local core.autocrlf false
          git -c core.autocrlf=false reset --hard "$AUTOTRADE_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$AUTOTRADE_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install repository pinned verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run all lifecycle cost, evidence, negative and allocation-integration tests
        run: >-
          python -m unittest -v
          mvp.tests.test_lifecycle_cost
          mvp.tests.test_lifecycle_cost_completeness
          mvp.tests.test_lifecycle_cost_allocation_integration
          mvp.tests.test_lifecycle_cost_instrument_identity
          mvp.tests.test_lifecycle_cost_valuation
      - name: Run capacity replay and economics authority negative checks
        run: python -m unittest discover -s tests/Science -p "test_strategy_economics_authority.py" -v
      - name: Write exact-SHA qualified test evidence
        run: >-
          python tools/write_ci_evidence.py
          --suite section17-lifecycle-cost-qualification
          --command "python -m unittest -v mvp.tests.test_lifecycle_cost mvp.tests.test_lifecycle_cost_completeness mvp.tests.test_lifecycle_cost_allocation_integration mvp.tests.test_lifecycle_cost_instrument_identity mvp.tests.test_lifecycle_cost_valuation && python -m unittest discover -s tests/Science -p test_strategy_economics_authority.py -v"
          --output "artifacts/section17-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: section17-evidence-${{ runner.os }}
          path: artifacts/section17-${{ runner.os }}.json
          if-no-files-found: error
