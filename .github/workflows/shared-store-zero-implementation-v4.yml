name: shared-store-zero-implementation-v4

on:
  push:
    branches:
      - fix/shared-store-zero-checkpoint-outbox-20261005-sol56
    paths:
      - .github/workflows/shared-store-zero-implementation-v4.yml

permissions:
  contents: write

concurrency:
  group: shared-store-zero-implementation-v4
  cancel-in-progress: true

jobs:
  implement-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Apply scoped ZERO authority implementation
        run: python .github/scripts/shared_store_zero_patch.py
      - name: Compile touched production modules
        run: python -m py_compile mvp/autotrade_mvp/_persistence_impl.py mvp/autotrade_mvp/simulation_runtime_checkpoint.py mvp/autotrade_mvp/simulation_session.py
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Prove shared-store checkpoint and outbox ownership
        run: python -m unittest mvp.tests.test_shared_store_zero_checkpoint_outbox -v
      - name: Prove checkpoint regressions
        run: python -m unittest discover -s mvp/tests -p 'test_*checkpoint*.py' -v
      - name: Prove simulation session regressions
        run: python -m unittest discover -s mvp/tests -p 'test_*simulation_session*.py' -v
      - name: Commit implementation and retire temporary workers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/shared-store-zero-implementation-v4.yml
          if [ -f .github/workflows/shared-store-zero-implementation-v3.yml ]; then
            git rm .github/workflows/shared-store-zero-implementation-v3.yml
          fi
          git rm .github/scripts/shared_store_zero_patch.py
          git add mvp/autotrade_mvp/_persistence_impl.py mvp/autotrade_mvp/simulation_runtime_checkpoint.py mvp/autotrade_mvp/simulation_session.py
          git commit -m 'Fix: scope ZERO checkpoint and outbox ownership'
          git push origin HEAD:fix/shared-store-zero-checkpoint-outbox-20261005-sol56
