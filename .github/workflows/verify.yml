name: Verify AutoTrade

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # The retained 120-episode unattended/recovery scenario was still making
    # forward progress when an exact-head Ubuntu Verify run hit its 20-minute
    # timeout. Keep a finite boundary with enough headroom on both runners so
    # core verification can emit exact-head evidence without removing tests.
    timeout-minutes: 45
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.100"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run cross-platform core verification
        run: python tools/verify.py
      - name: Write exact-head core verification evidence
        run: python tools/write_ci_evidence.py --suite core-repository --command "python tools/verify.py" --output "artifacts/verify-${{ runner.os }}.json"
      - name: Upload exact-head verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence-${{ runner.os }}
          path: artifacts/verify-${{ runner.os }}.json
          if-no-files-found: error
