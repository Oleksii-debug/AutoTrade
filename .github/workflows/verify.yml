name: Verify AutoTrade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Build .NET contract foundation
        run: dotnet build src/AutoTrade.Contracts/AutoTrade.Contracts.csproj --configuration Release --nologo
      - name: Run complete repository verification
        run: python tools/verify.py
