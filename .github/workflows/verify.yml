name: Verify AutoTrade

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The retained 120-episode unattended/recovery scenario now exceeds the
    # former 10-minute Linux budget while still making forward progress.
    # Preserve a finite hang boundary on both runners without timing out the
    # canonical core verification before it can produce exact-head evidence.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          cache: pip
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.100"
      - name: Install test dependencies
        run: "python -m pip install --disable-pip-version-check --force-reinstall --no-deps --only-binary=:all: --require-hashes -r requirements-dev.txt"
      - name: Run cross-platform core verification
        run: python tools/verify.py
      - name: Write exact-head core verification evidence
        run: python tools/write_ci_evidence.py --suite core-repository --command "python tools/verify.py" --output "artifacts/verify-${{ runner.os }}.json"
      - name: Upload exact-head verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-evidence-${{ runner.os }}
          path: artifacts/verify-${{ runner.os }}.json
          if-no-files-found: error
