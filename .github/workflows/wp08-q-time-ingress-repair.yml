name: WP08 provider-Q time ingress repair

on:
  push:
    branches:
      - "wp08/inert-q-time-ingress-20261005-sol56-g91"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded provider-Q temporal ingress repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("mvp/autotrade_mvp/durable_provider_qualification.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''def _point(value: datetime, *, name: str) -> datetime:\n    if (\n        type(value) is not datetime\n        or value.tzinfo is None\n        or value.utcoffset() is None\n    ):\n        raise ProviderQualificationError(\n            f"{name} must be an exact timezone-aware datetime"\n        )\n    return value.astimezone(timezone.utc)\n'''
          new = '''def _point(value: datetime, *, name: str) -> datetime:\n    # Exact datetime alone is insufficient: its nested tzinfo can still be a\n    # caller-defined Python object.  Reject executable timezone authority\n    # before utcoffset()/astimezone() can dispatch through caller code.\n    if type(value) is not datetime or type(value.tzinfo) is not timezone:\n        raise ProviderQualificationError(\n            f"{name} must be an exact timezone-aware datetime"\n        )\n    return value.astimezone(timezone.utc)\n'''
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit("unexpected durable_provider_qualification._point implementation")
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("mvp/tests/test_provider_qualification_time_ingress.py")
          test_path.write_text('''from __future__ import annotations\n\nfrom datetime import datetime, timedelta, timezone, tzinfo\nimport unittest\n\nfrom mvp.autotrade_mvp.durable_provider_qualification import (\n    ProviderQualificationError,\n    _point,\n)\n\n\nclass _ExecutableTimezone(tzinfo):\n    def __init__(self) -> None:\n        self.calls = 0\n\n    def utcoffset(self, _dt):\n        self.calls += 1\n        raise AssertionError("caller timezone executed at provider-Q ingress")\n\n    def dst(self, _dt):\n        raise AssertionError("caller timezone dst executed")\n\n    def tzname(self, _dt):\n        raise AssertionError("caller timezone tzname executed")\n\n\nclass ProviderQualificationTimeIngressTests(unittest.TestCase):\n    def test_exact_datetime_with_executable_timezone_is_rejected_without_callback(self):\n        hostile = _ExecutableTimezone()\n        value = datetime(2026, 10, 5, 18, 0, tzinfo=hostile)\n\n        with self.assertRaises(ProviderQualificationError):\n            _point(value, name="at")\n\n        self.assertEqual(hostile.calls, 0)\n\n    def test_exact_builtin_timezones_remain_supported_and_normalize_to_utc(self):\n        values = (\n            (datetime(2026, 10, 5, 16, 0, tzinfo=timezone.utc), 16),\n            (\n                datetime(\n                    2026,\n                    10,\n                    5,\n                    18,\n                    0,\n                    tzinfo=timezone(timedelta(hours=2)),\n                ),\n                16,\n            ),\n        )\n\n        for value, expected_hour in values:\n            with self.subTest(value=value):\n                normalized = _point(value, name="at")\n                self.assertIs(normalized.tzinfo, timezone.utc)\n                self.assertEqual(normalized.hour, expected_hour)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY

      - name: Focused verification
        shell: bash
        run: |
          python -m py_compile \
            mvp/autotrade_mvp/durable_provider_qualification.py \
            mvp/tests/test_provider_qualification_time_ingress.py
          python -m unittest \
            mvp.tests.test_provider_qualification_time_ingress \
            mvp.tests.test_provider_qualification_authority

      - name: Commit verified repair and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mvp/autotrade_mvp/durable_provider_qualification.py \
            mvp/tests/test_provider_qualification_time_ingress.py
          git rm .github/workflows/wp08-q-time-ingress-repair.yml
          git commit -m "fix: make provider qualification time ingress inert"
          git push origin "HEAD:${GITHUB_REF_NAME}"
