name: wp18-contract-fixture-migration
on:
  push:
    branches:
      - fix/wp18-prepared-scope-authority-d8a944-20260930
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wp18-prepared-scope-authority-d8a944-20260930
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Bind provider contract fixtures to canonical financial authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(filename, replacements):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              import_anchor = 'from mvp.autotrade_mvp.provider_core import observe_submission_json_response\n'
              helper_import = (
                  'from tests.Contracts.financial_authority_fixture import '
                  'canonical_financial_dispatch_guard\n'
              )
              assert text.count(import_anchor) == 1, (filename, 'import anchor')
              if helper_import not in text:
                  text = text.replace(import_anchor, import_anchor + helper_import, 1)
              marker_import = '    PreparedSubmissionAuthorityCheck,\n'
              assert text.count(marker_import) == 1, (filename, 'marker import')
              text = text.replace(marker_import, '', 1)
              for old, new in replacements:
                  count = text.count(old)
                  assert count == 1, (filename, old, count)
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          edit(
              'tests/Contracts/test_alpaca_adapter_contracts.py',
              [
                  (
                      '''        def contract_authority(_intent, _now, prepared_scope, prepared_scope_hash):\n            if prepared_scope_hash != payload_digest(submission_scope):\n                return False, "prepared_scope_hash_mismatch"\n            return True, "allowed"\n\n        outcome = dispatcher.dispatch(''',
                      '''        authority_check, authority_intent_hash = canonical_financial_dispatch_guard(\n            store,\n            provider_id="ALPACA",\n            provider_environment="PAPER",\n            account_id="contract-account",\n            environment="PAPER",\n            capability_snapshot_id=request.capability_snapshot_ids[0],\n            intent_id=intent_id,\n            submission_scope=submission_scope,\n            now="2026-09-24T20:00:00Z",\n        )\n\n        outcome = dispatcher.dispatch(''',
                  ),
                  ('            intent_hash="contract-intent-hash",\n', '            intent_hash=authority_intent_hash,\n'),
                  ('            authority_check=PreparedSubmissionAuthorityCheck(contract_authority),\n', '            authority_check=authority_check,\n'),
              ],
          )

          edit(
              'tests/Contracts/test_bybit_v5_contracts.py',
              [
                  (
                      '''        def contract_authority(\n            _intent_hash,\n            _now,\n            prepared_scope,\n            prepared_scope_hash,\n        ):\n            if prepared_scope_hash != payload_digest(dict(prepared_scope)):\n                return False, "prepared_scope_hash_mismatch"\n            if prepared_scope.get("provider") != "BYBIT":\n                return False, "provider_mismatch"\n            if prepared_scope.get("account_id") != "contract-account":\n                return False, "account_mismatch"\n            if prepared_scope.get("environment") != "LIVE":\n                return False, "environment_mismatch"\n            if prepared_scope.get("provider_environment") != "MAINNET":\n                return False, "provider_environment_mismatch"\n            if prepared_scope.get("endpoint") != prepared.endpoint:\n                return False, "endpoint_mismatch"\n            if (\n                prepared_scope.get("prepared_request_sha256")\n                != prepared.body_sha256\n            ):\n                return False, "prepared_request_mismatch"\n            return True, "allowed"\n\n        outcome = dispatcher.dispatch(''',
                      '''        authority_check, authority_intent_hash = canonical_financial_dispatch_guard(\n            store,\n            provider_id="BYBIT",\n            provider_environment="MAINNET",\n            account_id="contract-account",\n            environment="LIVE",\n            capability_snapshot_id=prepared.capability_snapshot_ids[0],\n            intent_id=intent_id,\n            submission_scope=submission_scope,\n            now="2026-09-24T20:00:00Z",\n        )\n\n        outcome = dispatcher.dispatch(''',
                  ),
                  ('            intent_hash="contract-intent-hash",\n', '            intent_hash=authority_intent_hash,\n'),
                  ('            authority_check=PreparedSubmissionAuthorityCheck(contract_authority),\n', '            authority_check=authority_check,\n'),
              ],
          )

          edit(
              'tests/Contracts/test_kraken_futures_contracts.py',
              [
                  (
                      '''        def contract_authority(_intent, _now, prepared_scope, prepared_scope_hash):\n            if prepared_scope_hash != payload_digest(submission_scope):\n                return False, "prepared_scope_hash_mismatch"\n            return True, "allowed"\n\n        outcome = dispatcher.dispatch(''',
                      '''        authority_check, authority_intent_hash = canonical_financial_dispatch_guard(\n            store,\n            provider_id="KRAKEN",\n            provider_environment="DEMO",\n            account_id="contract-account",\n            environment="PAPER",\n            capability_snapshot_id=request.capability_snapshot_id,\n            intent_id=intent_id,\n            submission_scope=submission_scope,\n            now=NOW,\n        )\n\n        outcome = dispatcher.dispatch(''',
                  ),
                  ('            intent_hash="contract-intent-hash",\n', '            intent_hash=authority_intent_hash,\n'),
                  ('            authority_check=PreparedSubmissionAuthorityCheck(contract_authority),\n', '            authority_check=authority_check,\n'),
              ],
          )

          edit(
              'tests/Contracts/test_kraken_spot_contracts.py',
              [
                  (
                      '''            def contract_authority(\n                _intent,\n                _now,\n                prepared_scope,\n                prepared_scope_hash,\n            ):\n                if prepared_scope_hash != payload_digest(submission_scope):\n                    return False, "prepared_scope_hash_mismatch"\n                return True, "allowed"\n\n            outcome = dispatcher.dispatch(''',
                      '''            authority_check, authority_intent_hash = canonical_financial_dispatch_guard(\n                store,\n                provider_id="KRAKEN",\n                provider_environment=prepared_request.environment,\n                account_id=prepared_request.account_id,\n                environment=prepared_request.environment,\n                capability_snapshot_id=prepared_request.capability_snapshot_id,\n                intent_id=intent_id,\n                submission_scope=submission_scope,\n                now="2026-09-24T20:00:00Z",\n            )\n\n            outcome = dispatcher.dispatch(''',
                  ),
                  ('                intent_hash="kraken-spot-contract-intent",\n', '                intent_hash=authority_intent_hash,\n'),
                  ('                authority_check=PreparedSubmissionAuthorityCheck(contract_authority),\n', '                authority_check=authority_check,\n'),
              ],
          )
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run provider contract fixtures with canonical authority
        run: |
          python -m unittest -v \
            tests.Contracts.test_alpaca_adapter_contracts \
            tests.Contracts.test_bybit_v5_contracts \
            tests.Contracts.test_kraken_futures_contracts \
            tests.Contracts.test_kraken_spot_contracts
      - name: Commit migration and remove workflow
        shell: bash
        run: |
          rm .github/workflows/wp18-contract-fixture-migration.yml
          git config user.name "autotrade-wp18-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Contracts/test_alpaca_adapter_contracts.py tests/Contracts/test_bybit_v5_contracts.py tests/Contracts/test_kraken_futures_contracts.py tests/Contracts/test_kraken_spot_contracts.py .github/workflows/wp18-contract-fixture-migration.yml
          git commit -m "WP-18: use canonical authority in provider contract fixtures"
          git push origin HEAD:fix/wp18-prepared-scope-authority-d8a944-20260930
