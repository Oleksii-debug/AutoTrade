name: wp18-contract-fixture-migration
on:
  push:
    branches:
      - fix/wp18-prepared-scope-authority-d8a944-20260930
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wp18-prepared-scope-authority-d8a944-20260930
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Move provider contract fixtures below financial authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/Contracts/test_alpaca_adapter_contracts.py': [
                  ('environment="PAPER",\n            account_id="contract-account",', 'environment="SIMULATION",\n            account_id="contract-account",'),
                  ('"environment": "PAPER",\n            "provider_environment": "PAPER",', '"environment": "SIMULATION",\n            "provider_environment": "PAPER",'),
                  ('store,\n            environment="PAPER",\n            account_id="contract-account",\n            attempt_id=attempt_id,', 'store,\n            environment="SIMULATION",\n            account_id="contract-account",\n            attempt_id=attempt_id,'),
              ],
              'tests/Contracts/test_bybit_v5_contracts.py': [
                  ('environment="LIVE",\n            account_id="contract-account",', 'environment="SIMULATION",\n            account_id="contract-account",'),
                  ('"environment": "LIVE",\n            "endpoint": prepared.endpoint,', '"environment": "SIMULATION",\n            "endpoint": prepared.endpoint,'),
                  ('prepared_scope.get("environment") != "LIVE"', 'prepared_scope.get("environment") != "SIMULATION"'),
                  ('store,\n            environment="LIVE",\n            account_id="contract-account",\n            attempt_id=attempt_id,', 'store,\n            environment="SIMULATION",\n            account_id="contract-account",\n            attempt_id=attempt_id,'),
              ],
              'tests/Contracts/test_kraken_futures_contracts.py': [
                  ('environment="PAPER",\n            account_id="contract-account",', 'environment="SIMULATION",\n            account_id="contract-account",'),
                  ('"environment": "PAPER",\n            "provider_environment": "DEMO",', '"environment": "SIMULATION",\n            "provider_environment": "DEMO",'),
                  ('store,\n            environment="PAPER",\n            account_id="contract-account",\n            attempt_id=attempt,', 'store,\n            environment="SIMULATION",\n            account_id="contract-account",\n            attempt_id=attempt,'),
              ],
              'tests/Contracts/test_kraken_spot_contracts.py': [
                  ('environment=prepared_request.environment,\n                account_id=prepared_request.account_id,', 'environment="SIMULATION",\n                account_id=prepared_request.account_id,'),
                  ('"environment": prepared_request.environment,\n                "provider_environment": prepared_request.environment,', '"environment": "SIMULATION",\n                "provider_environment": prepared_request.environment,'),
                  ('store,\n                environment=prepared_request.environment,\n                account_id=prepared_request.account_id,\n                attempt_id=attempt_id,', 'store,\n                environment="SIMULATION",\n                account_id=prepared_request.account_id,\n                attempt_id=attempt_id,'),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = text.count(old)
                  assert count == 1, (filename, old, count)
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run migrated provider contract fixtures
        run: |
          python -m unittest -v \
            tests.Contracts.test_alpaca_adapter_contracts \
            tests.Contracts.test_bybit_v5_contracts \
            tests.Contracts.test_kraken_futures_contracts \
            tests.Contracts.test_kraken_spot_contracts
      - name: Commit migration and remove workflow
        shell: bash
        run: |
          rm .github/workflows/wp18-contract-fixture-migration.yml
          git config user.name "autotrade-wp18-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Contracts/test_alpaca_adapter_contracts.py tests/Contracts/test_bybit_v5_contracts.py tests/Contracts/test_kraken_futures_contracts.py tests/Contracts/test_kraken_spot_contracts.py .github/workflows/wp18-contract-fixture-migration.yml
          git commit -m "WP-18: keep provider contract fixtures below financial authority"
          git push origin HEAD:fix/wp18-prepared-scope-authority-d8a944-20260930
