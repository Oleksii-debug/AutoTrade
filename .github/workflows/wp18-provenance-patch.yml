name: wp18-provenance-patch
on:
  push:
    branches:
      - fix/wp18-prepared-scope-authority-d8a944-20260930
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wp18-prepared-scope-authority-d8a944-20260930
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Apply exact prepared-authority provenance repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mvp/autotrade_mvp/dispatch.py')
          text = path.read_text(encoding='utf-8')

          old = 'from types import MappingProxyType\n'
          new = 'from types import FunctionType, MappingProxyType\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          marker = '''PreparedAuthorityCheck = Callable[\n    [str, str, Mapping[str, Any], str], tuple[bool, str]\n]\n\n\n@dataclass(frozen=True)\nclass PreparedSubmissionAuthorityCheck:\n'''
          replacement = '''PreparedAuthorityCheck = Callable[\n    [str, str, Mapping[str, Any], str], tuple[bool, str]\n]\n\n\ndef _is_canonical_prepared_authority_callback(callback: Any) -> bool:\n    \"\"\"Accept only the exact AuthorityService.dispatch_guard closure.\n\n    PAPER/LIVE financial authority must execute the canonical AuthorityService\n    admission/risk/reservation checks.  PreparedSubmissionAuthorityCheck is a\n    calling-convention wrapper, not authority by itself; arbitrary callbacks,\n    subclasses, proxies and delegates must not acquire send authority merely by\n    matching its public signature.\n    \"\"\"\n\n    if type(callback) is not FunctionType:\n        return False\n    try:\n        from .authority import AuthorityService\n    except ImportError:\n        return False\n\n    expected_qualname = (\n        f\"{AuthorityService.dispatch_guard.__qualname__}.<locals>.check\"\n    )\n    if (\n        callback.__module__ != AuthorityService.__module__\n        or callback.__qualname__ != expected_qualname\n    ):\n        return False\n\n    code_type = type(callback.__code__)\n    expected_codes = tuple(\n        constant\n        for constant in AuthorityService.dispatch_guard.__code__.co_consts\n        if isinstance(constant, code_type)\n        and getattr(constant, \"co_qualname\", None) == expected_qualname\n    )\n    if len(expected_codes) != 1 or callback.__code__ is not expected_codes[0]:\n        return False\n\n    closure = callback.__closure__\n    if closure is None or len(closure) != len(callback.__code__.co_freevars):\n        return False\n    try:\n        closed = {\n            name: cell.cell_contents\n            for name, cell in zip(callback.__code__.co_freevars, closure)\n        }\n    except ValueError:\n        return False\n    return type(closed.get(\"self\")) is AuthorityService\n\n\n@dataclass(frozen=True)\nclass PreparedSubmissionAuthorityCheck:\n'''
          assert text.count(marker) == 1, text.count(marker)
          text = text.replace(marker, replacement, 1)

          marker = '''    def __call__(\n        self,\n        intent_hash: str,\n        now: str,\n        submission_scope: Mapping[str, Any],\n        submission_scope_hash: str,\n    ) -> tuple[bool, str]:\n        return self.callback(\n            intent_hash,\n            now,\n            submission_scope,\n            submission_scope_hash,\n        )\n\n\nSenderCheck = Callable[[str, int], None]\n'''
          replacement = '''    def __call__(\n        self,\n        intent_hash: str,\n        now: str,\n        submission_scope: Mapping[str, Any],\n        submission_scope_hash: str,\n    ) -> tuple[bool, str]:\n        return self.callback(\n            intent_hash,\n            now,\n            submission_scope,\n            submission_scope_hash,\n        )\n\n\ndef _is_canonical_prepared_authority_check(value: Any) -> bool:\n    return (\n        type(value) is PreparedSubmissionAuthorityCheck\n        and _is_canonical_prepared_authority_callback(value.callback)\n    )\n\n\nSenderCheck = Callable[[str, int], None]\n'''
          assert text.count(marker) == 1, text.count(marker)
          text = text.replace(marker, replacement, 1)

          old = '    if isinstance(authority_check, PreparedSubmissionAuthorityCheck):\n'
          new = '    if type(authority_check) is PreparedSubmissionAuthorityCheck:\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''            if not isinstance(\n                authority_check,\n                PreparedSubmissionAuthorityCheck,\n            ):\n                financial_preflight_reason = \"prepared_scope_authority_required\"\n'''
          new = '''            if not _is_canonical_prepared_authority_check(authority_check):\n                financial_preflight_reason = \"prepared_scope_authority_required\"\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('mvp/tests/test_prepared_authority_provenance.py')
          test.write_text(r'''from tempfile import TemporaryDirectory\nimport unittest\n\nfrom mvp.autotrade_mvp.dispatch import (\n    GuardedDispatcher,\n    PreparedSubmissionAuthorityCheck,\n)\nfrom mvp.autotrade_mvp.persistence import JournalStore, payload_digest\n\n\nclass ForgedPreparedAuthority(PreparedSubmissionAuthorityCheck):\n    def __call__(self, _intent, _now, _scope, _scope_hash):\n        return True, \"forged-subclass\"\n\n\nclass DelegatingPreparedAuthority:\n    def __init__(self, wrapped):\n        self.wrapped = wrapped\n\n    def __call__(self, intent, now, scope, scope_hash):\n        return self.wrapped(intent, now, scope, scope_hash)\n\n\nclass PreparedAuthorityProvenanceTests(unittest.TestCase):\n    def test_paper_rejects_direct_subclass_and_proxy_prepared_authority(self):\n        for name, forged in (\n            (\n                \"direct\",\n                PreparedSubmissionAuthorityCheck(\n                    lambda _intent, _now, _scope, _scope_hash: (True, \"forged\")\n                ),\n            ),\n            (\n                \"subclass\",\n                ForgedPreparedAuthority(\n                    lambda _intent, _now, _scope, _scope_hash: (True, \"forged\")\n                ),\n            ),\n            (\n                \"proxy\",\n                DelegatingPreparedAuthority(\n                    PreparedSubmissionAuthorityCheck(\n                        lambda _intent, _now, _scope, _scope_hash: (True, \"forged\")\n                    )\n                ),\n            ),\n        ):\n            with self.subTest(name=name), TemporaryDirectory() as directory:\n                store = JournalStore(f\"{directory}/journal.sqlite3\")\n                dispatcher = GuardedDispatcher(\n                    store,\n                    environment=\"PAPER\",\n                    account_id=\"acct\",\n                    owner_token=\"owner\",\n                )\n                request = {\"side\": \"BUY\", \"quantity\": \"1\"}\n                scope = {\n                    \"provider\": \"SIM\",\n                    \"provider_environment\": \"MAINNET\",\n                    \"account_id\": \"acct\",\n                    \"environment\": \"PAPER\",\n                    \"prepared_request_sha256\": payload_digest(request),\n                }\n                outbound = 0\n\n                def transport(_client_id, _request, _guard):\n                    nonlocal outbound\n                    outbound += 1\n                    raise AssertionError(\"forged financial authority reached transport\")\n\n                result = dispatcher.dispatch(\n                    attempt_id=f\"forged-{name}\",\n                    intent_id=f\"intent-{name}\",\n                    intent_hash=f\"hash-{name}\",\n                    provider=\"SIM\",\n                    request=request,\n                    now=\"2026-09-30T01:20:00Z\",\n                    authority_check=forged,\n                    transport_send=transport,\n                    sender_check=lambda _owner, _epoch: None,\n                    submission_scope=scope,\n                )\n                self.assertEqual(result.status, \"BLOCKED\")\n                self.assertEqual(result.reason, \"prepared_scope_authority_required\")\n                self.assertEqual(outbound, 0)\n                events = store.load_events(\n                    \"submission_attempt\",\n                    dispatcher._aggregate_id(f\"forged-{name}\"),\n                )\n                self.assertEqual(\n                    [event[\"event_type\"] for event in events],\n                    [\"SubmissionPrepared\", \"SubmissionBlocked\"],\n                )\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run provenance regression
        run: python -m unittest -v mvp.tests.test_prepared_authority_provenance
      - name: Commit repair and remove patch workflow
        shell: bash
        run: |
          rm .github/workflows/wp18-provenance-patch.yml
          git config user.name "autotrade-wp18-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mvp/autotrade_mvp/dispatch.py mvp/tests/test_prepared_authority_provenance.py .github/workflows/wp18-provenance-patch.yml
          git commit -m "WP-18: require canonical prepared financial authority"
          git push origin HEAD:fix/wp18-prepared-scope-authority-d8a944-20260930
