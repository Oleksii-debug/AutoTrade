name: wp18-provenance-patch
on:
  push:
    branches:
      - fix/wp18-prepared-scope-authority-d8a944-20260930
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wp18-prepared-scope-authority-d8a944-20260930
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Apply exact prepared-authority provenance repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mvp/autotrade_mvp/dispatch.py')
          text = path.read_text(encoding='utf-8')

          old = 'from types import MappingProxyType\n'
          new = 'from types import FunctionType, MappingProxyType\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          marker = '''PreparedAuthorityCheck = Callable[\n    [str, str, Mapping[str, Any], str], tuple[bool, str]\n]\n\n\n@dataclass(frozen=True)\nclass PreparedSubmissionAuthorityCheck:\n'''
          replacement = '''PreparedAuthorityCheck = Callable[\n    [str, str, Mapping[str, Any], str], tuple[bool, str]\n]\n\n\ndef _is_canonical_prepared_authority_callback(callback: Any) -> bool:\n    \"\"\"Accept only the exact AuthorityService.dispatch_guard closure.\n\n    PAPER/LIVE financial authority must execute the canonical AuthorityService\n    admission/risk/reservation checks. PreparedSubmissionAuthorityCheck is a\n    calling-convention wrapper, not authority by itself; arbitrary callbacks,\n    subclasses, proxies and delegates must not acquire send authority merely by\n    matching its public signature.\n    \"\"\"\n\n    if type(callback) is not FunctionType:\n        return False\n    try:\n        from .authority import AuthorityService\n    except ImportError:\n        return False\n\n    expected_qualname = f\"{AuthorityService.dispatch_guard.__qualname__}.<locals>.check\"\n    if (\n        callback.__module__ != AuthorityService.__module__\n        or callback.__qualname__ != expected_qualname\n    ):\n        return False\n\n    code_type = type(callback.__code__)\n    expected_codes = tuple(\n        constant\n        for constant in AuthorityService.dispatch_guard.__code__.co_consts\n        if isinstance(constant, code_type)\n        and getattr(constant, \"co_qualname\", None) == expected_qualname\n    )\n    if len(expected_codes) != 1 or callback.__code__ is not expected_codes[0]:\n        return False\n\n    closure = callback.__closure__\n    if closure is None or len(closure) != len(callback.__code__.co_freevars):\n        return False\n    try:\n        closed = {\n            name: cell.cell_contents\n            for name, cell in zip(callback.__code__.co_freevars, closure)\n        }\n    except ValueError:\n        return False\n    return type(closed.get(\"self\")) is AuthorityService\n\n\n@dataclass(frozen=True)\nclass PreparedSubmissionAuthorityCheck:\n'''
          assert text.count(marker) == 1, text.count(marker)
          text = text.replace(marker, replacement, 1)

          marker = '''    def __call__(\n        self,\n        intent_hash: str,\n        now: str,\n        submission_scope: Mapping[str, Any],\n        submission_scope_hash: str,\n    ) -> tuple[bool, str]:\n        return self.callback(\n            intent_hash,\n            now,\n            submission_scope,\n            submission_scope_hash,\n        )\n\n\nSenderCheck = Callable[[str, int], None]\n'''
          replacement = '''    def __call__(\n        self,\n        intent_hash: str,\n        now: str,\n        submission_scope: Mapping[str, Any],\n        submission_scope_hash: str,\n    ) -> tuple[bool, str]:\n        return self.callback(\n            intent_hash,\n            now,\n            submission_scope,\n            submission_scope_hash,\n        )\n\n\ndef _is_canonical_prepared_authority_check(value: Any) -> bool:\n    return (\n        type(value) is PreparedSubmissionAuthorityCheck\n        and _is_canonical_prepared_authority_callback(value.callback)\n    )\n\n\nSenderCheck = Callable[[str, int], None]\n'''
          assert text.count(marker) == 1, text.count(marker)
          text = text.replace(marker, replacement, 1)

          old = '    if isinstance(authority_check, PreparedSubmissionAuthorityCheck):\n'
          new = '    if type(authority_check) is PreparedSubmissionAuthorityCheck:\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''            if not isinstance(\n                authority_check,\n                PreparedSubmissionAuthorityCheck,\n            ):\n                financial_preflight_reason = \"prepared_scope_authority_required\"\n'''
          new = '''            if not _is_canonical_prepared_authority_check(authority_check):\n                financial_preflight_reason = \"prepared_scope_authority_required\"\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          cat > mvp/tests/test_prepared_authority_provenance.py <<'PYTEST'
          from tempfile import TemporaryDirectory
          import unittest

          from mvp.autotrade_mvp.dispatch import (
              GuardedDispatcher,
              PreparedSubmissionAuthorityCheck,
          )
          from mvp.autotrade_mvp.persistence import JournalStore, payload_digest


          class ForgedPreparedAuthority(PreparedSubmissionAuthorityCheck):
              def __call__(self, _intent, _now, _scope, _scope_hash):
                  return True, "forged-subclass"


          class DelegatingPreparedAuthority:
              def __init__(self, wrapped):
                  self.wrapped = wrapped

              def __call__(self, intent, now, scope, scope_hash):
                  return self.wrapped(intent, now, scope, scope_hash)


          class PreparedAuthorityProvenanceTests(unittest.TestCase):
              def test_paper_rejects_direct_subclass_and_proxy_prepared_authority(self):
                  for name, forged in (
                      (
                          "direct",
                          PreparedSubmissionAuthorityCheck(
                              lambda _intent, _now, _scope, _scope_hash: (True, "forged")
                          ),
                      ),
                      (
                          "subclass",
                          ForgedPreparedAuthority(
                              lambda _intent, _now, _scope, _scope_hash: (True, "forged")
                          ),
                      ),
                      (
                          "proxy",
                          DelegatingPreparedAuthority(
                              PreparedSubmissionAuthorityCheck(
                                  lambda _intent, _now, _scope, _scope_hash: (True, "forged")
                              )
                          ),
                      ),
                  ):
                      with self.subTest(name=name), TemporaryDirectory() as directory:
                          store = JournalStore(f"{directory}/journal.sqlite3")
                          dispatcher = GuardedDispatcher(
                              store,
                              environment="PAPER",
                              account_id="acct",
                              owner_token="owner",
                          )
                          request = {"side": "BUY", "quantity": "1"}
                          scope = {
                              "provider": "SIM",
                              "provider_environment": "MAINNET",
                              "account_id": "acct",
                              "environment": "PAPER",
                              "prepared_request_sha256": payload_digest(request),
                          }
                          outbound = 0

                          def transport(_client_id, _request, _guard):
                              nonlocal outbound
                              outbound += 1
                              raise AssertionError("forged financial authority reached transport")

                          result = dispatcher.dispatch(
                              attempt_id=f"forged-{name}",
                              intent_id=f"intent-{name}",
                              intent_hash=f"hash-{name}",
                              provider="SIM",
                              request=request,
                              now="2026-09-30T01:20:00Z",
                              authority_check=forged,
                              transport_send=transport,
                              sender_check=lambda _owner, _epoch: None,
                              submission_scope=scope,
                          )
                          self.assertEqual(result.status, "BLOCKED")
                          self.assertEqual(result.reason, "prepared_scope_authority_required")
                          self.assertEqual(outbound, 0)
                          events = store.load_events(
                              "submission_attempt",
                              dispatcher._aggregate_id(f"forged-{name}"),
                          )
                          self.assertEqual(
                              [event["event_type"] for event in events],
                              ["SubmissionPrepared", "SubmissionBlocked"],
                          )


          if __name__ == "__main__":
              unittest.main()
          PYTEST
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run provenance regression
        run: python -m unittest -v mvp.tests.test_prepared_authority_provenance
      - name: Commit repair and remove patch workflow
        shell: bash
        run: |
          rm .github/workflows/wp18-provenance-patch.yml
          git config user.name "autotrade-wp18-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mvp/autotrade_mvp/dispatch.py mvp/tests/test_prepared_authority_provenance.py .github/workflows/wp18-provenance-patch.yml
          git commit -m "WP-18: require canonical prepared financial authority"
          git push origin HEAD:fix/wp18-prepared-scope-authority-d8a944-20260930
