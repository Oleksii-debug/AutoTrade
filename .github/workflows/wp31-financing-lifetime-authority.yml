name: WP31 financing lifetime authority binding

on:
  push:
    branches:
      - "wp31/deterministic-provider-epoch-ms-20261005-sol56-g91"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Seal financing lifetime authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("mvp/autotrade_mvp/durable_financing.py")
          source = source_path.read_text(encoding="utf-8")

          source = source.replace(
              "import json\nfrom typing import Any, Mapping, Protocol\n",
              "import json\nfrom threading import RLock\nfrom typing import Any, Mapping, Protocol\nimport weakref\n",
              1,
          )
          source = source.replace(
              "from .persistence import JournalStore, canonical_json, payload_digest\n",
              "from .persistence import (\n    JournalStore,\n    canonical_json,\n    payload_digest,\n    require_exact_journal_store_authority,\n)\n",
              1,
          )

          class_marker = '''class DurableFinancingBook:\n    """Journal-backed provider/account financing revision authority."""\n'''
          binding_block = '''@dataclass(frozen=True)\nclass _DurableFinancingAuthorityBinding:\n    store_ref: weakref.ReferenceType\n    economic_book_ref: weakref.ReferenceType\n    store_identity: object\n    provider_id: str\n    account_id: str\n    environment: str\n\n\ndef _build_durable_financing_authority_accessors():\n    """Retain selected financing authority outside caller-mutable instance state."""\n\n    bindings: dict[\n        int,\n        tuple[weakref.ReferenceType, _DurableFinancingAuthorityBinding],\n    ] = {}\n    lock = RLock()\n\n    def prune_dead() -> None:\n        with lock:\n            dead = [\n                object_id\n                for object_id, (value_ref, _binding) in bindings.items()\n                if value_ref() is None\n            ]\n            for object_id in dead:\n                bindings.pop(object_id, None)\n\n    def registered_binding(\n        value: object,\n    ) -> _DurableFinancingAuthorityBinding | None:\n        object_id = id(value)\n        with lock:\n            entry = bindings.get(object_id)\n            if entry is None:\n                return None\n            value_ref, binding = entry\n            current = value_ref()\n            if current is value:\n                return binding\n            if current is None:\n                bindings.pop(object_id, None)\n                return None\n            raise FinancingConflict("durable financing binding identity collision")\n\n    def is_registered(value: object) -> bool:\n        try:\n            prune_dead()\n            return registered_binding(value) is not None\n        except TypeError:\n            return False\n\n    def initialize(value: object) -> None:\n        if type(value) is not DurableFinancingBook:\n            raise TypeError("financing book must be exact DurableFinancingBook")\n        prune_dead()\n        if registered_binding(value) is not None:\n            raise FinancingConflict("financing authority is already established")\n        state = object.__getattribute__(value, "__dict__")\n        store = state.get("store")\n        economic_book = state.get("economic_book")\n        if type(store) is not JournalStore:\n            raise TypeError("store must be the exact canonical JournalStore")\n        if type(economic_book) is not DurableProviderEconomicBook:\n            raise TypeError(\n                "economic_book must be the exact canonical DurableProviderEconomicBook"\n            )\n        try:\n            identity = require_exact_journal_store_authority(\n                store,\n                subject="durable financing JournalStore",\n            )\n            economic_store = economic_book.store\n            economic_identity = require_exact_journal_store_authority(\n                economic_store,\n                subject="durable financing economic JournalStore",\n            )\n        except (AccountingConflict, TypeError, RuntimeError) as error:\n            raise FinancingConflict(\n                "financing authority composition is invalid"\n            ) from error\n        if not same_journal_backing_object(identity, economic_identity):\n            raise FinancingConflict(\n                "financing and economic authorities must share JournalStore backing generation"\n            )\n        binding = _DurableFinancingAuthorityBinding(\n            store_ref=weakref.ref(store),\n            economic_book_ref=weakref.ref(economic_book),\n            store_identity=identity,\n            provider_id=state["provider_id"],\n            account_id=state["account_id"],\n            environment=state["environment"],\n        )\n        with lock:\n            if registered_binding(value) is not None:\n                raise FinancingConflict("financing authority is already established")\n            bindings[id(value)] = (weakref.ref(value), binding)\n\n    def require(value: object) -> _DurableFinancingAuthorityBinding:\n        if type(value) is not DurableFinancingBook:\n            raise TypeError("financing book must be exact DurableFinancingBook")\n        prune_dead()\n        binding = registered_binding(value)\n        if binding is None:\n            raise FinancingConflict("financing authority is not established")\n        state = object.__getattribute__(value, "__dict__")\n        store = binding.store_ref()\n        economic_book = binding.economic_book_ref()\n        if store is None or economic_book is None:\n            raise FinancingConflict(\n                "financing authority resource was released while book is live"\n            )\n        if (\n            state.get("store") is not store\n            or state.get("economic_book") is not economic_book\n            or state.get("provider_id") != binding.provider_id\n            or state.get("account_id") != binding.account_id\n            or state.get("environment") != binding.environment\n        ):\n            raise FinancingConflict(\n                "financing authority state changed after construction"\n            )\n        try:\n            current_identity = require_exact_journal_store_authority(\n                store,\n                subject="durable financing JournalStore",\n            )\n            economic_store = economic_book.store\n            economic_identity = require_exact_journal_store_authority(\n                economic_store,\n                subject="durable financing economic JournalStore",\n            )\n        except (AccountingConflict, TypeError, RuntimeError) as error:\n            raise FinancingConflict("financing authority generation changed") from error\n        if current_identity != binding.store_identity:\n            raise FinancingConflict("financing JournalStore generation changed")\n        if not same_journal_backing_object(current_identity, economic_identity):\n            raise FinancingConflict(\n                "financing and economic authorities no longer share one JournalStore generation"\n            )\n        if (\n            economic_book.provider_id != binding.provider_id\n            or economic_book.account_id != binding.account_id\n            or economic_book.environment != binding.environment\n        ):\n            raise FinancingConflict(\n                "financing and economic authority scope changed"\n            )\n        return binding\n\n    return is_registered, initialize, require\n\n\nclass DurableFinancingBook:\n    """Journal-backed provider/account financing revision authority."""\n'''
          if "class _DurableFinancingAuthorityBinding" not in source:\n              if source.count(class_marker) != 1:\n                  raise SystemExit("DurableFinancingBook marker not found exactly once")\n              source = source.replace(class_marker, binding_block, 1)\n
          init_marker = '''    def __init__(\n        self,\n        store: JournalStore,\n        economic_book: DurableProviderEconomicBook,\n        *,\n        provider_id: str,\n        account_id: str,\n        environment: str,\n    ):\n        if type(store) is not JournalStore:\n'''
          init_replacement = '''    def __init__(\n        self,\n        store: JournalStore,\n        economic_book: DurableProviderEconomicBook,\n        *,\n        provider_id: str,\n        account_id: str,\n        environment: str,\n    ):\n        if _durable_financing_authority_is_registered(self):\n            raise FinancingConflict("financing authority is already established")\n        if type(store) is not JournalStore:\n'''
          if "if _durable_financing_authority_is_registered(self):" not in source:\n              if source.count(init_marker) != 1:\n                  raise SystemExit("DurableFinancingBook.__init__ marker not found exactly once")\n              source = source.replace(init_marker, init_replacement, 1)\n
          scope_marker = '''        if (\n            economic_book.provider_id != self.provider_id\n            or economic_book.account_id != self.account_id\n            or economic_book.environment != self.environment\n        ):\n            raise ValueError(\n                "financing and economic authorities must share provider/account/environment"\n            )\n\n    def _aggregate_id(self, charge_id: str) -> str:\n'''
          scope_replacement = '''        if (\n            economic_book.provider_id != self.provider_id\n            or economic_book.account_id != self.account_id\n            or economic_book.environment != self.environment\n        ):\n            raise ValueError(\n                "financing and economic authorities must share provider/account/environment"\n            )\n        _initialize_durable_financing_authority(self)\n\n    def _aggregate_id(self, charge_id: str) -> str:\n        _require_durable_financing_authority(self)\n'''
          if "_initialize_durable_financing_authority(self)" not in source:\n              if source.count(scope_marker) != 1:\n                  raise SystemExit("financing constructor tail marker not found exactly once")\n              source = source.replace(scope_marker, scope_replacement, 1)\n
          method_markers = {\n              '''    def _events(self, charge_id: str) -> list[dict[str, Any]]:\n        return self.store.load_events(\n''': '''    def _events(self, charge_id: str) -> list[dict[str, Any]]:\n        _require_durable_financing_authority(self)\n        return self.store.load_events(\n''',\n              '''    def _stable_replay_cut(\n        self,\n        charge_id: str,\n        *,\n        max_attempts: int = 4,\n    ) -> tuple[int, list[dict[str, Any]], FinancingRevisionBook]:\n        """Read financing + economics only from a bounded stable journal cut."""\n\n        for _attempt in range(max_attempts):\n''': '''    def _stable_replay_cut(\n        self,\n        charge_id: str,\n        *,\n        max_attempts: int = 4,\n    ) -> tuple[int, list[dict[str, Any]], FinancingRevisionBook]:\n        """Read financing + economics only from a bounded stable journal cut."""\n\n        _require_durable_financing_authority(self)\n        for _attempt in range(max_attempts):\n''',\n              '''    def latest(self, charge_id: str) -> FinancingEvent | None:\n        normalized = _text(charge_id, name="charge_id")\n''': '''    def latest(self, charge_id: str) -> FinancingEvent | None:\n        _require_durable_financing_authority(self)\n        normalized = _text(charge_id, name="charge_id")\n''',\n              '''    def record_authenticated_artifact(\n        self,\n        artifact_store: AuthenticatedArtifactStore,\n        *,\n        artifact_id: str,\n        committed_at: str | None = None,\n    ) -> DurableFinancingResult:\n        (\n''': '''    def record_authenticated_artifact(\n        self,\n        artifact_store: AuthenticatedArtifactStore,\n        *,\n        artifact_id: str,\n        committed_at: str | None = None,\n    ) -> DurableFinancingResult:\n        _require_durable_financing_authority(self)\n        (\n''',\n              '''    def record_bybit_funding_observation(\n        self,\n        observation: ProviderResponseObservation,\n        artifact_store: AuthenticatedArtifactStore,\n        *,\n        artifact_id: str,\n        row_id: str,\n        instrument_registry: InstrumentRegistry,\n        instrument_versions: Mapping[str, str],\n        committed_at: str | None = None,\n    ) -> DurableFinancingResult:\n        if type(observation) is not ProviderResponseObservation:\n''': '''    def record_bybit_funding_observation(\n        self,\n        observation: ProviderResponseObservation,\n        artifact_store: AuthenticatedArtifactStore,\n        *,\n        artifact_id: str,\n        row_id: str,\n        instrument_registry: InstrumentRegistry,\n        instrument_versions: Mapping[str, str],\n        committed_at: str | None = None,\n    ) -> DurableFinancingResult:\n        _require_durable_financing_authority(self)\n        if type(observation) is not ProviderResponseObservation:\n''',\n              '''    def _record_preverified(\n        self,\n        *,\n        event: FinancingEvent,\n        artifact_id: str,\n        artifact_digest: str,\n        charge_scope_type: str,\n        charge_scope_id: str,\n        committed_at: str | None,\n    ) -> DurableFinancingResult:\n        aggregate_id = self._aggregate_id(event.charge_id)\n''': '''    def _record_preverified(\n        self,\n        *,\n        event: FinancingEvent,\n        artifact_id: str,\n        artifact_digest: str,\n        charge_scope_type: str,\n        charge_scope_id: str,\n        committed_at: str | None,\n    ) -> DurableFinancingResult:\n        _require_durable_financing_authority(self)\n        aggregate_id = self._aggregate_id(event.charge_id)\n''',\n          }\n          for old, new in method_markers.items():\n              if new not in source:\n                  if source.count(old) != 1:\n                      raise SystemExit("financing authority method marker not found exactly once")\n                  source = source.replace(old, new, 1)\n
          accessors = '''\n\n(\n    _durable_financing_authority_is_registered,\n    _initialize_durable_financing_authority,\n    _require_durable_financing_authority,\n) = _build_durable_financing_authority_accessors()\ndel _build_durable_financing_authority_accessors\n'''
          if "_durable_financing_authority_is_registered," not in source:\n              source = source.rstrip() + accessors + "\n"\n          source_path.write_text(source, encoding="utf-8")

          test_path = Path("mvp/tests/test_durable_financing.py")
          tests = test_path.read_text(encoding="utf-8")
          insert_marker = '''    def test_final_revision_and_economics_commit_atomically_and_restart(self):\n'''
          additions = '''    def test_store_retarget_fails_closed_before_financing_read(self):\n        other_store = JournalStore(Path(self.temp.name) / "other.sqlite3")\n        object.__setattr__(self.financing, "store", other_store)\n\n        with self.assertRaisesRegex(\n            FinancingConflict,\n            "authority state changed after construction",\n        ):\n            self.financing.latest("borrow-btc-2026-09-28")\n\n    def test_economic_book_retarget_fails_before_artifact_callback(self):\n        alternate_economic = DurableProviderEconomicBook(\n            self.store,\n            provider_id="BYBIT",\n            account_id="acct-1",\n            environment="SIMULATION",\n        )\n        object.__setattr__(self.financing, "economic_book", alternate_economic)\n\n        class HostileArtifacts:\n            calls = 0\n\n            def read_authenticated_snapshot(self, _artifact_id):\n                self.calls += 1\n                raise AssertionError("artifact callback executed before authority check")\n\n        hostile = HostileArtifacts()\n        with self.assertRaisesRegex(\n            FinancingConflict,\n            "authority state changed after construction",\n        ):\n            self.financing.record_authenticated_artifact(\n                hostile,\n                artifact_id="00000000-0000-0000-0000-000000000099",\n                committed_at=BASE.isoformat(),\n            )\n        self.assertEqual(hostile.calls, 0)\n\n    def test_reinitialization_cannot_replace_financing_authority(self):\n        other_store = JournalStore(Path(self.temp.name) / "reinit.sqlite3")\n        other_economic = DurableProviderEconomicBook(\n            other_store,\n            provider_id="BYBIT",\n            account_id="acct-1",\n            environment="SIMULATION",\n        )\n\n        with self.assertRaisesRegex(\n            FinancingConflict,\n            "authority is already established",\n        ):\n            self.financing.__init__(\n                other_store,\n                other_economic,\n                provider_id="BYBIT",\n                account_id="acct-1",\n                environment="SIMULATION",\n            )\n        self.assertIs(self.financing.store, self.store)\n        self.assertIs(self.financing.economic_book, self.economic)\n\n'''
          if "test_store_retarget_fails_closed_before_financing_read" not in tests:\n              if tests.count(insert_marker) != 1:\n                  raise SystemExit("durable financing test insertion marker not found exactly once")\n              tests = tests.replace(insert_marker, additions + insert_marker, 1)\n          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Focused verification
        shell: bash
        run: |
          python -m py_compile \
            mvp/autotrade_mvp/durable_financing.py \
            mvp/tests/test_durable_financing.py
          python -m unittest \
            mvp.tests.test_durable_financing \
            mvp.tests.test_durable_financing_restart_conservation

      - name: Commit verified continuation and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mvp/autotrade_mvp/durable_financing.py \
            mvp/tests/test_durable_financing.py
          git rm .github/workflows/wp31-financing-lifetime-authority.yml
          git commit -m "fix: seal financing authority for object lifetime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
