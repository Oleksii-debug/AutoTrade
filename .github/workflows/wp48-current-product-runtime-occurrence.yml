name: WP48 current product runtime occurrence

on:
  push:
    branches:
      - wp48/current-product-runtime-occurrence-20261005-sol56-g89

permissions:
  contents: write

jobs:
  reconverge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize reviewed occurrence authority onto current product host
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 59c0e37c19d0106fbd95babae48cbc4a5a10fd31
          git show 59c0e37c19d0106fbd95babae48cbc4a5a10fd31:mvp/autotrade_mvp/production_host.py > /tmp/historical-production-host.py
          git show 59c0e37c19d0106fbd95babae48cbc4a5a10fd31:mvp/tests/test_production_host_runtime_occurrence.py > mvp/tests/test_production_host_runtime_occurrence.py

          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path
          import textwrap

          target_path = Path('mvp/autotrade_mvp/production_host.py')
          current = target_path.read_text(encoding='utf-8')
          donor = Path('/tmp/historical-production-host.py').read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global current
              count = current.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one current-product preimage; found {count}: {old[:100]!r}'
                  )
              current = current.replace(old, new, 1)

          # Current product already has the stricter config snapshot/lifecycle work.
          # Add only imports needed by the reviewed occurrence authority.
          replace_once(
              'from dataclasses import dataclass\nfrom math import isfinite\n',
              'from dataclasses import dataclass\nfrom datetime import datetime, timezone\nfrom math import isfinite\n',
          )
          replace_once(
              'from urllib.parse import urlsplit\nfrom weakref import WeakKeyDictionary\n',
              'from urllib.parse import urlsplit\nfrom uuid import UUID, uuid4\nfrom weakref import WeakKeyDictionary\n',
          )
          replace_once(
              'from .persistence import JournalStore\n',
              'from .persistence import (\n'
              '    JournalStore,\n'
              '    journal_store_authority_scope,\n'
              '    payload_digest,\n'
              '    require_exact_journal_store_authority,\n'
              ')\n',
          )

          # Pull the exact hardened #1248 constant/closure authority block, not ancestry.
          donor_constants_start = donor.index(
              '_RUNTIME_OCCURRENCE_SCHEMA_VERSION = "1.0.0"'
          )
          donor_constants_end = donor.index(
              '\n\n\n@dataclass(frozen=True)\nclass ProductionHostConfig:',
              donor_constants_start,
          )
          occurrence_constants = donor[donor_constants_start:donor_constants_end].rstrip()
          constants_anchor = '_STOPPING_STATES = frozenset({"CLOSING", "CLOSED", "FAILED"})\n'
          replace_once(
              constants_anchor,
              constants_anchor + occurrence_constants + '\n',
          )

          # Pull only the reviewed occurrence value/reader/issuer block through #1248.
          donor_authority_start = donor.index(
              '@dataclass(frozen=True, slots=True)\nclass ProductionHostRuntimeOccurrence:'
          )
          donor_authority_end = donor.index(
              '\n\nclass _InstanceFence:',
              donor_authority_start,
          )
          occurrence_authority = donor[
              donor_authority_start:donor_authority_end
          ].rstrip()
          replace_once(
              '\n\nclass _InstanceFence:',
              '\n\n' + occurrence_authority + '\n\nclass _InstanceFence:',
          )

          # Pull the two closure-bound runtime methods from the hardened donor.
          donor_tree = ast.parse(donor)
          donor_runtime = next(
              node
              for node in donor_tree.body
              if isinstance(node, ast.ClassDef) and node.name == 'ProductionHostRuntime'
          )
          donor_lines = donor.splitlines(keepends=True)
          methods: list[str] = []
          for method_name in ('_bind_runtime_occurrence', 'runtime_occurrence'):
              node = next(
                  item
                  for item in donor_runtime.body
                  if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and item.name == method_name
              )
              start = min(
                  [node.lineno]
                  + [decorator.lineno for decorator in node.decorator_list]
              )
              segment = ''.join(donor_lines[start - 1:node.end_lineno]).rstrip()
              methods.append(segment)
          runtime_methods = '\n\n'.join(methods) + '\n\n'
          replace_once(
              '    @property\n    def closed(self) -> bool:\n',
              runtime_methods + '    @property\n    def closed(self) -> bool:\n',
          )

          # Preserve current issuance-token, store gate, cleanup, and terminal lifecycle.
          # Publish an occurrence only after listener + runtime composition succeeded.
          old_build = '''        server.daemon_threads = False
        server.block_on_close = True
        return ProductionHostRuntime(
            config=config,
            journal=journal,
            application=application,
            server=server,
            instance_fence=instance_fence,
            admission_gate=admission_gate,
            issuance_token=_RUNTIME_ISSUANCE_TOKEN,
        )
'''
          new_build = '''        server.daemon_threads = False
        server.block_on_close = True
        runtime = ProductionHostRuntime(
            config=config,
            journal=journal,
            application=application,
            server=server,
            instance_fence=instance_fence,
            admission_gate=admission_gate,
            issuance_token=_RUNTIME_ISSUANCE_TOKEN,
        )
        runtime_occurrence = _issue_production_host_runtime_occurrence(
            journal,
            config,
        )
        runtime._bind_runtime_occurrence(runtime_occurrence)
        return runtime
'''
          replace_once(old_build, new_build)

          # Refuse accidental duplicate/partial materialization.
          for expected in (
              'class ProductionHostRuntimeOccurrence:',
              'def require_current_production_host_runtime_occurrence(',
              'def _issue_production_host_runtime_occurrence(',
              'def _runtime_occurrence_binding_authority():',
              'runtime._bind_runtime_occurrence(runtime_occurrence)',
          ):
              if current.count(expected) != 1:
                  raise SystemExit(f'non-canonical occurrence materialization: {expected!r}')

          target_path.write_text(current, encoding='utf-8')
          PY

      - name: Verify current-product occurrence authority
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$PWD/mvp:$PWD/research"
          python -m py_compile mvp/autotrade_mvp/production_host.py mvp/tests/test_production_host_runtime_occurrence.py
          python -m unittest mvp.tests.test_production_host_runtime_occurrence -v
          python -m unittest mvp.tests.test_production_host -v

      - name: Commit bounded runtime occurrence and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mvp/autotrade_mvp/production_host.py mvp/tests/test_production_host_runtime_occurrence.py
          git rm .github/workflows/wp48-current-product-runtime-occurrence.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: reconverge durable production runtime occurrence"
          git push origin HEAD:${GITHUB_REF_NAME}
