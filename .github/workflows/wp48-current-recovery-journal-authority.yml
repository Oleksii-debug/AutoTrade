name: WP48 current recovery journal authority

on:
  push:
    branches:
      - wp48/current-product-recovery-journal-authority-20261005-sol56-g89

permissions:
  contents: write

jobs:
  reconverge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind recovery to exact JournalStore and canonical sender gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('mvp/autotrade_mvp/recovery.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected one recovery preimage, found {count}: {old[:100]!r}'
                  )
              text = text.replace(old, new, 1)

          replace_once(
              'from .persistence import JournalStore, payload_digest\n',
              'from .persistence import (\n'
              '    JournalStore,\n'
              '    payload_digest,\n'
              '    require_exact_journal_store_authority,\n'
              ')\n'
              'from .sender_gate import journal_sender_gate\n'
              'from .store_identity import (\n'
              '    JournalStoreIdentity,\n'
              '    require_exact_journal_store_identity,\n'
              ')\n',
          )

          replace_once(
              '        if owner_store is not None and not isinstance(owner_store, JournalStore):\n'
              '            raise TypeError("owner_store must be JournalStore or None")\n'
              '        if not isinstance(owner_scope, str) or not owner_scope.strip():\n'
              '            raise ValueError("owner_scope is required")\n'
              '        self._owner_store = owner_store\n'
              '        self._owner_scope = owner_scope.strip()\n',
              '        if not isinstance(owner_scope, str) or not owner_scope.strip():\n'
              '            raise ValueError("owner_scope is required")\n'
              '        self._owner_store = owner_store\n'
              '        self._owner_store_identity: JournalStoreIdentity | None = (\n'
              '            None\n'
              '            if owner_store is None\n'
              '            else require_exact_journal_store_authority(\n'
              '                owner_store,\n'
              '                subject="recovery owner JournalStore",\n'
              '            )\n'
              '        )\n'
              '        self._owner_scope = owner_scope.strip()\n',
          )

          replace_once(
              '    @property\n'
              '    def durable_owner_store_path(self) -> Path | None:\n'
              '        """Return the exact journal path backing sender fencing, if durable."""\n\n'
              '        return None if self._owner_store is None else self._owner_store.path\n',
              '    def _selected_journal_identity(self) -> JournalStoreIdentity:\n'
              '        identity = self._owner_store_identity\n'
              '        if identity is None:\n'
              '            raise PermissionError("Recovery controller has no durable journal authority")\n'
              '        return require_exact_journal_store_identity(\n'
              '            identity,\n'
              '            subject="selected recovery journal identity",\n'
              '        )\n\n'
              '    def _journal_store_authority(self) -> JournalStore:\n'
              '        if self._owner_store is None:\n'
              '            raise PermissionError("Recovery controller has no durable journal authority")\n'
              '        expected = self._selected_journal_identity()\n'
              '        identity = require_exact_journal_store_authority(\n'
              '            self._owner_store,\n'
              '            subject="recovery owner JournalStore",\n'
              '        )\n'
              '        if identity != expected:\n'
              '            raise PermissionError("recovery journal authority changed")\n'
              '        return self._owner_store\n\n'
              '    @property\n'
              '    def durable_owner_store_identity(self) -> JournalStoreIdentity | None:\n'
              '        """Return the pinned physical JournalStore identity, if durable."""\n\n'
              '        if self._owner_store is None:\n'
              '            return None\n'
              '        self._journal_store_authority()\n'
              '        return self._selected_journal_identity()\n\n'
              '    @property\n'
              '    def durable_owner_store_path(self) -> Path | None:\n'
              '        """Return the selected journal path backing sender fencing, if durable."""\n\n'
              '        if self._owner_store is None:\n'
              '            return None\n'
              '        self._journal_store_authority()\n'
              '        return Path(self._selected_journal_identity().canonical_path)\n',
          )

          replace_once(
              '        events = self._owner_store.load_events(\n'
              '            self._OWNER_AGGREGATE_TYPE,\n'
              '            self._owner_scope,\n'
              '        )\n',
              '        store = self._journal_store_authority()\n'
              '        events = JournalStore.load_events(\n'
              '            store,\n'
              '            self._OWNER_AGGREGATE_TYPE,\n'
              '            self._owner_scope,\n'
              '        )\n',
          )

          replace_once(
              '        self._owner_store.append_event(\n'
              '            {\n',
              '        store = self._journal_store_authority()\n'
              '        JournalStore.append_event(\n'
              '            store,\n'
              '            {\n',
          )

          replace_once(
              '        events = self._owner_store.load_events_by_aggregate_type(\n'
              '            "submission_attempt"\n'
              '        )\n',
              '        store = self._journal_store_authority()\n'
              '        events = JournalStore.load_events_by_aggregate_type(\n'
              '            store,\n'
              '            "submission_attempt",\n'
              '        )\n',
          )

          replace_once(
              '        checkpoint = load_reconciliation_checkpoint_for_readiness(\n'
              '            self._owner_store,\n',
              '        store = self._journal_store_authority()\n'
              '        checkpoint = load_reconciliation_checkpoint_for_readiness(\n'
              '            store,\n',
          )

          replace_once(
              '        normalized_owner = owner_id.strip()\n'
              '        durable = self._latest_durable_owner()\n'
              '        if durable is not None:\n'
              '            raise PermissionError(\n'
              '                "Existing durable owner requires explicit takeover evidence"\n'
              '            )\n'
              '        candidate = OwnerFence(owner_id=normalized_owner, epoch=1)\n'
              '        self._append_durable_owner(candidate)\n'
              '        self.owner = candidate\n'
              '        self.state = HostState.RECOVERING\n'
              '        self.provider_reconciled = False\n'
              '        self.reason_codes = {"startup_reconciliation_required"}\n'
              '        self._recover_scoped_submission_uncertainty_from_owner_scope()\n'
              '        return self.owner\n',
              '        normalized_owner = owner_id.strip()\n'
              '        with journal_sender_gate(self._owner_store):\n'
              '            durable = self._latest_durable_owner()\n'
              '            if self._owner_store is not None and durable is not None:\n'
              '                raise PermissionError(\n'
              '                    "Durable owner already exists; independently authorized takeover is required"\n'
              '                )\n'
              '            next_epoch = 1 if durable is None else durable.epoch + 1\n'
              '            candidate = OwnerFence(\n'
              '                owner_id=normalized_owner,\n'
              '                epoch=next_epoch,\n'
              '            )\n'
              '            self._append_durable_owner(candidate)\n'
              '            self.owner = candidate\n'
              '            self.state = HostState.RECOVERING\n'
              '            self.provider_reconciled = False\n'
              '            self.reason_codes = {"startup_reconciliation_required"}\n'
              '            self._recover_scoped_submission_uncertainty_from_owner_scope()\n'
              '            return self.owner\n',
          )

          path.write_text(text, encoding='utf-8')

          Path('mvp/tests/test_recovery_store_authority_current.py').write_text(
              '''from __future__ import annotations\n\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nfrom autotrade_mvp.persistence import JournalStore\nfrom autotrade_mvp.recovery import RecoveryController\n\n\nclass RecoveryStoreAuthorityTests(unittest.TestCase):\n    def _store(self, root: str) -> JournalStore:\n        return JournalStore(Path(root) / "journal.sqlite3")\n\n    def test_journalstore_subclass_cannot_be_recovery_authority(self) -> None:\n        class HostileStore(JournalStore):\n            pass\n        forged = object.__new__(HostileStore)\n        with self.assertRaises(TypeError):\n            RecoveryController(owner_store=forged, owner_scope="PAPER:acct")\n\n    def test_selected_physical_identity_is_retained(self) -> None:\n        with tempfile.TemporaryDirectory() as root:\n            store = self._store(root)\n            controller = RecoveryController(owner_store=store, owner_scope="PAPER:acct")\n            self.assertEqual(controller.durable_owner_store_identity, store.store_identity)\n            self.assertEqual(controller.durable_owner_store_path, Path(store.store_identity.canonical_path))\n\n    def test_instance_method_shadow_fails_before_recovery_read(self) -> None:\n        with tempfile.TemporaryDirectory() as root:\n            store = self._store(root)\n            controller = RecoveryController(owner_store=store, owner_scope="PAPER:acct")\n            store.load_events = lambda *args, **kwargs: []\n            with self.assertRaises(TypeError):\n                controller.durable_owner_chain()\n\n    def test_lost_physical_identity_fails_before_recovery_read(self) -> None:\n        with tempfile.TemporaryDirectory() as root:\n            store = self._store(root)\n            controller = RecoveryController(owner_store=store, owner_scope="PAPER:acct")\n            store._store_identity = None\n            with self.assertRaises(RuntimeError):\n                controller.durable_owner_chain()\n\n\nif __name__ == "__main__":\n    unittest.main()\n''',
              encoding='utf-8',
          )
          PY

      - name: Materialize durable clock-incident generation and recovery binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin cd31b13559e21f6bf32757561dd677995355f900
          git show cd31b13559e21f6bf32757561dd677995355f900:mvp/autotrade_mvp/recovery_clock_incident.py > mvp/autotrade_mvp/recovery_clock_incident.py
          git show cd31b13559e21f6bf32757561dd677995355f900:mvp/tests/test_recovery_clock_incident_chronology.py > mvp/tests/test_recovery_clock_incident_chronology.py
          python - <<'PY'
          from pathlib import Path

          path = Path('mvp/autotrade_mvp/recovery.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected one clock-incident preimage, found {count}: {old[:100]!r}'
                  )
              text = text.replace(old, new, 1)

          replace_once(
              'from .reconciliation_journal import load_reconciliation_checkpoint_for_readiness\n',
              'from .recovery_clock_incident import (\n'
              '    append_clock_trust_transition,\n'
              '    clock_incident_generation as durable_clock_incident_generation,\n'
              '    clock_trusted_after_replay,\n'
              ')\n'
              'from .reconciliation_journal import load_reconciliation_checkpoint_for_readiness\n',
          )

          replace_once(
              '        self.storage_writable = True\n'
              '        self.clock_trusted = True\n'
              '        self.provider_reconciled = False\n',
              '        self.storage_writable = True\n'
              '        self.clock_trusted = (\n'
              '            True\n'
              '            if owner_store is None\n'
              '            else clock_trusted_after_replay(\n'
              '                owner_store,\n'
              '                owner_scope=self._owner_scope,\n'
              '            )\n'
              '        )\n'
              '        self.provider_reconciled = False\n',
          )

          path_anchor = (
              '    @property\n'
              '    def durable_owner_store_path(self) -> Path | None:\n'
              '        """Return the selected journal path backing sender fencing, if durable."""\n\n'
              '        if self._owner_store is None:\n'
              '            return None\n'
              '        self._journal_store_authority()\n'
              '        return Path(self._selected_journal_identity().canonical_path)\n'
          )
          replace_once(
              path_anchor,
              path_anchor
              + '\n'
              + '    @property\n'
              + '    def clock_incident_generation(self) -> int:\n'
              + '        """Return the durable clock invalidation generation, not UTC authority."""\n\n'
              + '        if self._owner_store is None:\n'
              + '            return 0\n'
              + '        return durable_clock_incident_generation(\n'
              + '            self._journal_store_authority(),\n'
              + '            owner_scope=self._owner_scope,\n'
              + '        )\n',
          )

          replace_once(
              '    def set_clock_trusted(self, trusted: bool) -> None:\n'
              '        if type(trusted) is not bool:\n'
              '            raise TypeError("trusted must be a boolean")\n'
              '        self.clock_trusted = trusted\n',
              '    def set_clock_trusted(\n'
              '        self,\n'
              '        trusted: bool,\n'
              '        *,\n'
              '        reason_code: str | None = None,\n'
              '        evidence_ref: str | None = None,\n'
              '    ) -> None:\n'
              '        if type(trusted) is not bool:\n'
              '            raise TypeError("trusted must be a boolean")\n'
              '        if self._owner_store is not None and trusted != self.clock_trusted:\n'
              '            if self.owner is None:\n'
              '                raise PermissionError(\n'
              '                    "Durable clock trust transition requires an active recovery owner"\n'
              '                )\n'
              '            append_clock_trust_transition(\n'
              '                self._journal_store_authority(),\n'
              '                owner_scope=self._owner_scope,\n'
              '                owner_id=self.owner.owner_id,\n'
              '                owner_epoch=self.owner.epoch,\n'
              '                trusted=trusted,\n'
              '                reason_code=(\n'
              '                    reason_code\n'
              '                    if reason_code is not None\n'
              '                    else (\n'
              '                        "clock-trust-restored"\n'
              '                        if trusted\n'
              '                        else "clock-untrusted"\n'
              '                    )\n'
              '                ),\n'
              '                evidence_ref=evidence_ref,\n'
              '                committed_at=self._now(),\n'
              '            )\n'
              '        self.clock_trusted = trusted\n',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify recovery authority through durable clock incidents
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$PWD/mvp:$PWD/research"
          python -m py_compile \
            mvp/autotrade_mvp/recovery.py \
            mvp/autotrade_mvp/sender_gate.py \
            mvp/autotrade_mvp/recovery_clock_incident.py \
            mvp/tests/test_recovery_store_authority_current.py \
            mvp/tests/test_recovery_sender_gate_current.py \
            mvp/tests/test_recovery_clock_incident_chronology.py
          PYTHONPATH="$PWD/mvp:$PWD" python -m unittest discover -s mvp/tests -p 'test_recovery_store_authority_current.py' -v
          PYTHONPATH="$PWD/mvp:$PWD" python -m unittest discover -s mvp/tests -p 'test_recovery_sender_gate_current.py' -v
          python -m unittest mvp.tests.test_recovery_clock_incident_chronology -v
          PYTHONPATH="$PWD/mvp:$PWD" python -m unittest discover -s mvp/tests -p 'test_recovery_durable_unknown_restart.py' -v
          PYTHONPATH="$PWD/mvp:$PWD" python -m unittest discover -s mvp/tests -p 'test_runtime_failure_control.py' -v

      - name: Commit bounded chronology prerequisite and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mvp/autotrade_mvp/recovery.py \
            mvp/autotrade_mvp/recovery_clock_incident.py \
            mvp/tests/test_recovery_store_authority_current.py \
            mvp/tests/test_recovery_clock_incident_chronology.py
          git rm .github/workflows/wp48-current-recovery-journal-authority.yml
          git diff --cached --check
          git commit -m "fix: reconverge durable recovery chronology prerequisite"
          git push origin HEAD:${GITHUB_REF_NAME}
