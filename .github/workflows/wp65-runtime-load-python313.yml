name: WP-65 current-main runtime load Python 3.13

on:
  pull_request:
    paths:
      - "mvp/autotrade_mvp/performance_qualification.py"
      - "mvp/autotrade_mvp/journal_taxonomy.py"
      - "mvp/autotrade_mvp/runtime_load_evidence.py"
      - "mvp/autotrade_mvp/runtime_load_plan.py"
      - "mvp/autotrade_mvp/runtime_load_measurement.py"
      - "mvp/autotrade_mvp/runtime_load_research_measurement.py"
      - "mvp/autotrade_mvp/runtime_load_campaign.py"
      - "mvp/tests/test_performance_qualification.py"
      - "mvp/tests/test_runtime_resource_budget.py"
      - "mvp/tests/test_runtime_load_evidence.py"
      - "mvp/tests/test_runtime_load_evidence_full_cut.py"
      - "mvp/tests/test_runtime_load_evidence_input_snapshot.py"
      - "mvp/tests/test_runtime_load_plan.py"
      - "mvp/tests/test_runtime_load_plan_limits.py"
      - "mvp/tests/test_runtime_load_measurement.py"
      - "mvp/tests/test_runtime_load_measurement_backlog.py"
      - "mvp/tests/test_runtime_load_measurement_cut.py"
      - "mvp/tests/test_runtime_load_measurement_journal_transitive_authority.py"
      - "mvp/tests/test_runtime_load_measurement_plan_instance_authority.py"
      - "mvp/tests/test_runtime_load_measurement_schema_authority.py"
      - "mvp/tests/test_runtime_load_research_measurement.py"
      - "mvp/tests/test_runtime_load_research_measurement_frame_authority.py"
      - "mvp/tests/test_runtime_load_campaign.py"
      - "mvp/tests/test_runtime_load_campaign_backlog.py"
      - ".github/workflows/wp65-runtime-load-python313.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-load-authority:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AUTOTRADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      AUTOTRADE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.AUTOTRADE_SOURCE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.16"
      - name: Run current-main WP-65 durable runtime-load authority tests
        run: >-
          python -m unittest -v
          mvp.tests.test_performance_qualification
          mvp.tests.test_runtime_resource_budget
          mvp.tests.test_runtime_load_evidence
          mvp.tests.test_runtime_load_evidence_full_cut
          mvp.tests.test_runtime_load_evidence_input_snapshot
          mvp.tests.test_runtime_load_plan
          mvp.tests.test_runtime_load_plan_limits
          mvp.tests.test_runtime_load_measurement
          mvp.tests.test_runtime_load_measurement_backlog
          mvp.tests.test_runtime_load_measurement_cut
          mvp.tests.test_runtime_load_measurement_journal_transitive_authority
          mvp.tests.test_runtime_load_measurement_plan_instance_authority
          mvp.tests.test_runtime_load_measurement_schema_authority
          mvp.tests.test_runtime_load_research_measurement
          mvp.tests.test_runtime_load_research_measurement_frame_authority
          mvp.tests.test_runtime_load_campaign
          mvp.tests.test_runtime_load_campaign_backlog
      - name: Write exact-head current-main WP-65 evidence
        run: >-
          python tools/write_ci_evidence.py
          --suite wp65-current-main-runtime-load-python313
          --command "python -m unittest -v mvp.tests.test_performance_qualification mvp.tests.test_runtime_resource_budget mvp.tests.test_runtime_load_evidence mvp.tests.test_runtime_load_evidence_full_cut mvp.tests.test_runtime_load_evidence_input_snapshot mvp.tests.test_runtime_load_plan mvp.tests.test_runtime_load_plan_limits mvp.tests.test_runtime_load_measurement mvp.tests.test_runtime_load_measurement_backlog mvp.tests.test_runtime_load_measurement_cut mvp.tests.test_runtime_load_measurement_journal_transitive_authority mvp.tests.test_runtime_load_measurement_plan_instance_authority mvp.tests.test_runtime_load_measurement_schema_authority mvp.tests.test_runtime_load_research_measurement mvp.tests.test_runtime_load_research_measurement_frame_authority mvp.tests.test_runtime_load_campaign mvp.tests.test_runtime_load_campaign_backlog"
          --output "artifacts/wp65-current-main-runtime-load-python313-${{ runner.os }}.json"
      - name: Upload exact-head current-main WP-65 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp65-current-main-runtime-load-python313-${{ runner.os }}
          path: artifacts/wp65-current-main-runtime-load-python313-${{ runner.os }}.json
          if-no-files-found: error
