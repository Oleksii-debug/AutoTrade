name: zero-model-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "qualification/zero_model/**"
      - "mvp/autotrade_mvp/model_gateway.py"
      - "mvp/autotrade_mvp/pipeline.py"
      - "mvp/autotrade_mvp/economics.py"
      - "mvp/tests/test_zero_model_qualification.py"
      - ".github/workflows/zero-model-qualification.yml"
  push:
    branches: [main]
    paths:
      - "qualification/zero_model/**"
      - "mvp/autotrade_mvp/model_gateway.py"
      - "mvp/autotrade_mvp/pipeline.py"
      - "mvp/autotrade_mvp/economics.py"
      - "mvp/tests/test_zero_model_qualification.py"
      - ".github/workflows/zero-model-qualification.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - run: python -m unittest mvp.tests.test_zero_model_qualification -v
      - name: Assert and generate exact-head qualification evidence
        shell: bash
        run: |
          OBSERVED_SOURCE_SHA="$(git rev-parse HEAD)"
          test "$OBSERVED_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          python -m qualification.zero_model.qualify \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output "$RUNNER_TEMP/zero-model-evidence.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-model-qualification-${{ runner.os }}-${{ env.EXPECTED_SOURCE_SHA }}
          path: ${{ runner.temp }}/zero-model-evidence.json
          if-no-files-found: error
