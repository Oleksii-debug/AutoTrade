name: zero-model-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "qualification/zero_model/**"
      - "mvp/autotrade_mvp/model_gateway.py"
      - "mvp/autotrade_mvp/pipeline.py"
      - "mvp/autotrade_mvp/economics.py"
      - "mvp/tests/test_zero_model_qualification.py"
      - ".github/workflows/zero-model-qualification.yml"
  push:
    branches: [main]
    paths:
      - "qualification/zero_model/**"
      - "mvp/autotrade_mvp/model_gateway.py"
      - "mvp/autotrade_mvp/pipeline.py"
      - "mvp/autotrade_mvp/economics.py"
      - "mvp/tests/test_zero_model_qualification.py"
      - ".github/workflows/zero-model-qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest mvp.tests.test_zero_model_qualification -v
      - name: Assert and generate exact-head qualification evidence
        shell: bash
        run: |
          OBSERVED_SOURCE_SHA="$(git rev-parse HEAD)"
          test "$OBSERVED_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          python -m qualification.zero_model.qualify \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output "$RUNNER_TEMP/zero-model-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: zero-model-qualification-${{ env.EXPECTED_SOURCE_SHA }}
          path: ${{ runner.temp }}/zero-model-evidence.json
          if-no-files-found: error
