name: zero-shared-store-callsite-port

on:
  push:
    branches:
      - integration/zero-shared-store-after-binance-product-stack-20261005-sol56
    paths:
      - .github/workflows/zero-shared-store-callsite-port.yml

permissions:
  contents: write

jobs:
  port-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/zero-shared-store-after-binance-product-stack-20261005-sol56
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Apply exact scoped-delivery call-site port
        shell: python
        run: |
          from pathlib import Path

          path = Path('mvp/autotrade_mvp/simulation_session.py')
          text = path.read_text(encoding='utf-8')

          marker = '_LOOP_PROTOCOL = "provider-free-zero-loop-v7"\n\n\ndef _loop_event(\n'
          helper = '''_LOOP_PROTOCOL = "provider-free-zero-loop-v7"\n\n\ndef _deliver_autonomous_owned_publications(\n    store: JournalStore,\n    *,\n    run_id: str,\n) -> None:\n    from .simulation_runtime_checkpoint import deliver_autonomous_owned_publications\n\n    deliver_autonomous_owned_publications(store, run_id=run_id)\n\n\ndef _loop_event(\n'''
          assert text.count(marker) == 1, 'ZERO loop helper insertion preimage drifted'
          text = text.replace(marker, helper, 1)

          first = '''    if kind == "AutonomousEpisodeCompleted":\n        # Deliver existing publications before freezing the completion preimage.\n        for item in store.pending_outbox(limit=1000):\n            store.mark_outbox_delivered(item["outbox_id"], expected_envelope_hash=item["envelope_hash"])\n        from .simulation_runtime_checkpoint import (\n'''
          first_new = '''    if kind == "AutonomousEpisodeCompleted":\n        # Deliver existing ZERO-owned publications before freezing the completion preimage.\n        _deliver_autonomous_owned_publications(store, run_id=run_id)\n        from .simulation_runtime_checkpoint import (\n'''
          assert text.count(first) == 1, 'completion-preimage global drain preimage drifted'
          text = text.replace(first, first_new, 1)

          multi = '''    for item in store.pending_outbox(limit=1000):\n        store.mark_outbox_delivered(\n            item["outbox_id"],\n            expected_envelope_hash=item["envelope_hash"],\n        )\n'''
          assert text.count(multi) == 2, 'expected exactly two recovery global drains'
          text = text.replace(
              multi,
              '    _deliver_autonomous_owned_publications(store, run_id=run_id)\n',
          )

          terminal = '''        for item in store.pending_outbox(limit=1000):\n            store.mark_outbox_delivered(item["outbox_id"], expected_envelope_hash=item["envelope_hash"])\n'''
          assert text.count(terminal) == 1, 'expected exactly one terminal global drain'
          text = text.replace(
              terminal,
              '        _deliver_autonomous_owned_publications(store, run_id=run_id)\n',
              1,
          )

          text = text.replace(
              'every publication in this terminal cut are complete.',
              'every ZERO-owned publication in this terminal cut are complete.',
          )
          assert 'pending_outbox(limit=1000)' not in text[text.index('_LOOP_PROTOCOL = "provider-free-zero-loop-v7"'):], (
              'global pending-outbox drain remains in autonomous ZERO section'
          )
          path.write_text(text, encoding='utf-8')

      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Prove foreign-backlog ownership
        run: python -m unittest mvp.tests.test_shared_store_zero_foreign_backlog -v

      - name: Prove simulation regressions
        run: python -m unittest discover -s mvp/tests -p 'test_*simulation*.py' -v

      - name: Commit bounded result and remove worker
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zero-shared-store-callsite-port.yml
          git add mvp/autotrade_mvp/simulation_session.py
          git diff --cached --check
          git commit -m 'Fix: preserve Host outbox ownership in current ZERO session'
          git push origin HEAD:integration/zero-shared-store-after-binance-product-stack-20261005-sol56
