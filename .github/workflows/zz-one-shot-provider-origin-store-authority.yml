name: one-shot-provider-origin-store-authority

on:
  push:
    branches:
      - wp18/provider-origin-store-authority-0a48-sol56

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp18/provider-origin-store-authority-0a48-sol56
          fetch-depth: 0
      - name: Apply bounded production repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mvp/autotrade_mvp/provider_origin.py')
          text = path.read_text(encoding='utf-8')

          class_start = text.index('class ProviderOriginJournal:')
          class_end = text.index('\ndef _install_provider_origin_response_binding_authority', class_start)
          prefix, body, suffix = text[:class_start], text[class_start:class_end], text[class_end:]

          replacements = (
              ('JournalStore.append_event(', 'self._journal_append_event(', 5),
              ('JournalStore.load_events(', 'self._journal_load_events(', 4),
              ('ArtifactStore.publish_bytes(', 'self._artifact_publish_bytes(', 1),
              ('ArtifactStore.read_authenticated_snapshot(', 'self._artifact_read_authenticated_snapshot(', 3),
          )
          for old, new, expected in replacements:
              actual = body.count(old)
              if actual != expected:
                  raise SystemExit(f'unexpected ProviderOriginJournal dispatch count for {old}: {actual} != {expected}')
              body = body.replace(old, new)

          init_anchor = '        self._response_store = response_store\n        self._response_store_root = response_store.root.resolve(strict=False)\n'
          if body.count(init_anchor) != 1:
              raise SystemExit('ProviderOriginJournal init anchor changed')
          init_replacement = init_anchor + (
              '        # Retain the exact installed persistence/artifact executables at composition.\n'
              '        # Durable object identity alone is insufficient if class dispatch can be\n'
              '        # rebound after this authority has been composed.\n'
              '        self._journal_append_event = JournalStore.append_event\n'
              '        self._journal_load_events = JournalStore.load_events\n'
              '        self._artifact_publish_bytes = ArtifactStore.publish_bytes\n'
              '        self._artifact_read_authenticated_snapshot = (\n'
              '            ArtifactStore.read_authenticated_snapshot\n'
              '        )\n'
          )
          body = body.replace(init_anchor, init_replacement, 1)
          text = prefix + body + suffix

          load_start = text.index('def _load_direct_wire_execution_claim(')
          load_end = text.index('\ndef _require_direct_wire_execution_claim(', load_start)
          load_body = text[load_start:load_end]
          load_sig = '    attempt_id: str,\n) -> dict[str, object]:\n'
          if load_body.count(load_sig) != 1 or load_body.count('JournalStore.load_events(') != 1:
              raise SystemExit('direct wire load helper shape changed')
          load_body = load_body.replace(
              load_sig,
              '    attempt_id: str,\n    _load_events=JournalStore.load_events,\n) -> dict[str, object]:\n',
              1,
          ).replace('JournalStore.load_events(', '_load_events(', 1)
          text = text[:load_start] + load_body + text[load_end:]

          claim_start = text.index('def _claim_direct_wire_execution(')
          claim_end = text.index('\ndef _require_event(', claim_start)
          claim_body = text[claim_start:claim_end]
          claim_sig = '    terminal_authority_verified_at: str,\n) -> None:\n'
          if (
              claim_body.count(claim_sig) != 1
              or claim_body.count('JournalStore.current_journal_sequence(') != 1
              or claim_body.count('JournalStore.append_event(') != 1
          ):
              raise SystemExit('direct wire claim helper shape changed')
          claim_body = claim_body.replace(
              claim_sig,
              '    terminal_authority_verified_at: str,\n'
              '    _append_event=JournalStore.append_event,\n'
              '    _current_journal_sequence=JournalStore.current_journal_sequence,\n'
              ') -> None:\n',
              1,
          )
          claim_body = claim_body.replace(
              'JournalStore.current_journal_sequence(',
              '_current_journal_sequence(',
              1,
          ).replace('JournalStore.append_event(', '_append_event(', 1)
          text = text[:claim_start] + claim_body + text[claim_end:]

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile mvp/autotrade_mvp/provider_origin.py mvp/tests/test_provider_origin_store_dispatch_authority.py
          git diff --check
      - name: Commit bounded repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-one-shot-provider-origin-store-authority.yml
          git add mvp/autotrade_mvp/provider_origin.py
          git commit -m "WP-18: retain provider-origin store dispatch authority"
          git push origin HEAD:wp18/provider-origin-store-authority-0a48-sol56
