openapi: 3.1.0
info:
  title: AutoTrade Host API
  version: 6.2.0
  description: Canonical UI/host boundary. Accepted commands are not financial-completion claims.
servers:
  - url: https://localhost
security:
  - AutoTradeSession: []
    AutoTradeActor: []
paths:
  /api/v1/state:
    get:
      operationId: getState
      responses:
        "200":
          description: Current durable projection snapshot
          content:
            application/json:
              schema:
                $ref: ../jsonschema/ui.schema.json#/$defs/UiSnapshot
  /api/v1/commands:
    post:
      operationId: submitCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../jsonschema/ui.schema.json#/$defs/UiCommand
      responses:
        "200":
          description: Command admission result, not financial completion
          content:
            application/json:
              schema:
                $ref: ../jsonschema/ui.schema.json#/$defs/CommandResult
        "409":
          description: State/idempotency conflict
          content:
            application/json:
              schema:
                $ref: ../jsonschema/ui.schema.json#/$defs/CommandResult
  /api/v1/operations/{operation_id}:
    get:
      operationId: getOperation
      parameters:
        - in: path
          name: operation_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current operation phase
          content:
            application/json:
              schema:
                $ref: ../jsonschema/ui.schema.json#/$defs/OperationResult
  /api/v1/events:
    get:
      operationId: streamEvents
      parameters:
        - in: query
          name: after
          required: false
          schema:
            $ref: ../jsonschema/common.schema.json#/$defs/Sequence
      responses:
        "200":
          description: Resumable projection event stream; a detected cursor gap requires /api/v1/state resnapshot
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Component readiness/degradation status
          content:
            application/json:
              schema:
                $ref: ../jsonschema/provider.schema.json#/$defs/HealthResult
  /api/v1/historical/status:
    get:
      operationId: getHistoricalStatus
      responses:
        "200":
          description: Authenticated private-local ZERO campaign lifecycle status
  /api/v1/historical/results:
    get:
      operationId: getHistoricalResults
      responses:
        "200":
          description: Authenticated immutable historical campaign result projection
  /api/v1/historical/trades:
    get:
      operationId: getHistoricalTrades
      responses:
        "200":
          description: Authenticated bounded trade projection from the canonical ZERO OMS journal
  /api/v1/historical/start:
    post:
      operationId: startHistorical
      description: OWNER-only start of the fixed private-local ZERO campaign
      responses:
        "200":
          description: Current durable lifecycle status
  /api/v1/historical/pause:
    post:
      operationId: pauseHistorical
      description: OWNER-only process pause with durable workspace preserved
      responses:
        "200":
          description: Current durable lifecycle status
  /api/v1/historical/stop:
    post:
      operationId: stopHistorical
      description: OWNER-only stop with durable workspace preserved
      responses:
        "200":
          description: Current durable lifecycle status
  /api/v1/historical/resume:
    post:
      operationId: resumeHistorical
      description: OWNER-only restart of the same recoverable ZERO workspace
      responses:
        "200":
          description: Current durable lifecycle status
  /api/v1/historical/export:
    post:
      operationId: exportHistorical
      description: OWNER-only export of status, results and canonical simulated trades
      responses:
        "200":
          description: Historical ZERO evidence ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /api/v1/local-diagnostics:
    get:
      operationId: downloadLocalDiagnostics
      deprecated: true
      description: Compatibility-only combined local diagnostics export; new clients use the two independent report routes.
      responses:
        "200":
          description: Legacy diagnostic ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /api/v1/technical-diagnostics:
    get:
      operationId: downloadTechnicalDiagnostics
      description: Owner-only bounded technical heartbeat export; never grants trading authority.
      responses:
        "200":
          description: Persistent rotating technical heartbeat ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /api/v1/agent-report:
    get:
      operationId: downloadAgentReport
      description: Owner-only agent decisions, learning evidence and simulation outcomes export.
      responses:
        "200":
          description: Complete agent report ZIP from the durable local journal
          content:
            application/zip:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    AutoTradeSession:
      type: apiKey
      in: header
      name: Authorization
      description: Reusable high-entropy credential sent only as "AutoTrade-Session <token>"; never serialized into UI snapshots, commands, events, logs, or durable state.
    AutoTradeActor:
      type: apiKey
      in: header
      name: X-AutoTrade-Actor
      description: Authenticated actor identity bound by the host SecurityBoundary to the AutoTrade session and accepted origin/channel.
