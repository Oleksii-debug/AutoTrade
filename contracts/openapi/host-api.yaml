openapi: 3.1.0
info:
  title: AutoTrade Host API
  version: 6.0.0
  description: Canonical UI/host boundary. Accepted commands are not financial-completion claims.
servers:
  - url: https://localhost
security:
  - AutoTradeSession: []
    AutoTradeActor: []
paths:
  /api/v1/session:
    post:
      operationId: pairLocalSession
      description: One-time local owner session bootstrap from the launch URL fragment. No credential may enter query strings, durable state or Host logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pairing_code]
              properties:
                pairing_code:
                  type: string
                  minLength: 43
                  maxLength: 43
      responses:
        "200":
          description: Owner session cookie issued after exact one-time code and native handoff; response body contains no bearer token.
        "403":
          description: Pairing code rejected and no session authority granted.
        "503":
          description: Owner session handoff could not be made durable; token revoked, code remains retryable.
  /api/v1/state:
    get:
      operationId: getState
      responses:
        "200":
          description: Current durable projection snapshot
          content:
            application/json:
              schema:
                $ref: ../jsonschema/ui.schema.json#/$defs/UiSnapshot
  /api/v1/commands:
    post:
      operationId: submitCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../jsonschema/ui.schema.json#/$defs/UiCommand
      responses:
        "200":
          description: Command admission result, not financial completion
          content:
            application/json:
              schema:
                $ref: ../jsonschema/ui.schema.json#/$defs/CommandResult
        "409":
          description: State/idempotency conflict
          content:
            application/json:
              schema:
                $ref: ../jsonschema/ui.schema.json#/$defs/CommandResult
  /api/v1/operations/{operation_id}:
    get:
      operationId: getOperation
      parameters:
        - in: path
          name: operation_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current operation phase
          content:
            application/json:
              schema:
                $ref: ../jsonschema/ui.schema.json#/$defs/OperationResult
  /api/v1/events:
    get:
      operationId: streamEvents
      parameters:
        - in: query
          name: after
          required: false
          schema:
            $ref: ../jsonschema/common.schema.json#/$defs/Sequence
      responses:
        "200":
          description: Resumable projection event stream; a detected cursor gap requires /api/v1/state resnapshot
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Component readiness/degradation status
          content:
            application/json:
              schema:
                $ref: ../jsonschema/provider.schema.json#/$defs/HealthResult

components:
  securitySchemes:
    AutoTradeSession:
      type: apiKey
      in: header
      name: Authorization
      description: Reusable high-entropy credential sent only as "AutoTrade-Session <token>"; never serialized into UI snapshots, commands, events, logs, or durable state.
    AutoTradeActor:
      type: apiKey
      in: header
      name: X-AutoTrade-Actor
      description: Authenticated actor identity bound by the host SecurityBoundary to the AutoTrade session and accepted origin/channel.
