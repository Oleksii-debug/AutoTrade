[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrade-research"
version = "0.0.1"
description = "Isolated research and evidence utilities for AutoTrade"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["autotrade_research*"]
