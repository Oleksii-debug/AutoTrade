[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrade-research"
version = "0.0.1"
description = "Isolated research and evidence utilities for AutoTrade"
requires-python = ">=3.12"
dependencies = ["autotrade-exact-numeric==0.0.2"]

[project.optional-dependencies]
# Optional non-authoritative upstream research integrations. Never part of
# the AutoTrade financial host or default installation.
opensource-shadow = [
    "ccxt==4.5.82",
    "river==0.26.1",
    "optuna==5.0.0",
]

test = [
    "attrs==26.1.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "referencing==0.36.2",
    "rpds-py==2026.6.3",
    "typing-extensions==4.16.0",
]

[tool.setuptools.packages.find]
where = [".", ".."]
include = ["autotrade_research*", "autotrade_foundation*"]
